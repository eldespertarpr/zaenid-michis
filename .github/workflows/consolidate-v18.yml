name: Consolidate v18
on:
  push:
    branches: [consolidate-v18]
    paths:
      - 'scripts/consolidate-v18.js'
      - '.github/workflows/consolidate-v18.yml'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate-v18
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consolidate app source
        run: node scripts/consolidate-v18.js
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.rfind('<script>\n(()=>{')
          end=s.rfind('</script>')
          Path('/tmp/app.js').write_text(s[start+8:end])
          PY
          node --check /tmp/app.js
          node --check sw.js
      - name: Commit consolidated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Consolidate app source and simplify service worker'
          git push origin consolidate-v18

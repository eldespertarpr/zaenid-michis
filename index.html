    };

    const urgents=CATS.filter(c=>recs[c.id]?.urgent);
    const vis=CATS.filter(c=>{
      if(srch&&!c.name.toLowerCase().includes(srch.toLowerCase())&&!String(c.n).includes(srch))return false;

      return true;
    });
    const doPrint=()=>{
      const rows=CATS.map(c=>{const r=recs[c.id]||{};return`<tr style="border-bottom:1px solid #eee"><td style="padding:4px 6px;text-align:center">${c.n}</td><td style="padding:4px 6px">${c.name}${r.urgent?` <b style="color:red">\u26a0\ufe0f</b>`:""}</td><td style="padding:4px 6px;text-align:center">${r.am?"\u2713":""}</td><td style="padding:4px 6px;text-align:center">${r.pm?"\u2713":""}</td><td style="padding:4px 6px;text-align:center">${r.ate?"\u2713":""}</td><td style="padding:4px 6px;text-align:center">${r.water?"\u2713":""}</td><td style="padding:4px 6px;text-align:center">${r.litter?"\u2713":""}</td><td style="padding:4px 6px;text-align:center">${r.med?"\u2713":""}</td><td style="padding:4px 6px;font-size:11px">${r.careNotes||""}</td><td style="padding:4px 6px;font-size:11px">${r.medNotes||""}</td></tr>`;}).join("");

  function PeopleTab({dat,save,myUid}){

    const chg=async()=>{sMsg(null);if(np.length<6){sMsg({ok:false,t:"Min. 6 characters."});return;}if(np!==cp){sMsg({ok:false,t:"Passwords don't match."});return;}sBusy(true);try{await au.updatePassword(np);sNp("");sCp("");sMsg({ok:true,t:"Password updated!"});}catch(e){if(e.code==="auth/requires-recent-login"){await FAUTH.sendPasswordResetEmail(au.email);sMsg({ok:true,t:"Reset email sent \u2014 use that to change your password."});}else sMsg({ok:false,t:"Couldn't update. Try again."});}sBusy(false);};
    return <div className="p-4 space-y-4">
      <h2 className="text-base font-bold text-slate-800">Settings</h2>
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 space-y-3">
        <h3 className="font-semibold text-slate-700 text-sm">\ud83d\udd10 Change My Password</h3>
        <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">New password (min. 6)</label><input type="password" value={np} onChange={e=>sNp(e.target.value)} className={IC} placeholder="New password"/></div>
        <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Confirm</label><input type="password" value={cp} onChange={e=>sCp(e.target.value)} className={IC} placeholder="Repeat"/></div>
        {msg&&<div className={`text-sm px-3 py-2 rounded-xl ${msg.ok?"bg-emerald-100 text-emerald-700":"bg-red-100 text-red-600"}`}>{msg.t}</div>}
        <button onClick={chg} disabled={busy} className="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-sm disabled:opacity-50">{busy?"Updating\u2026":"Update Password"}</button>
      </div>
      <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4 text-sm text-amber-800 leading-relaxed"><strong>\ud83d\udca1 Adding volunteers:</strong> Create their login in Firebase Console first, then add them in People using the same email and their Firebase UID.</div>
    </div>;
  }

  function VolApp({au,per,dat,save,logout}){
    const [tab,sTab]=useState("care"),[ss,sSs]=useState(false);
    const mt=dat.tasks.filter(t=>t.date===tod()&&t.personId===per.uid);
    if(ss)return <div className="min-h-screen bg-slate-50 flex flex-col"><header className="bg-slate-900 text-white px-4 py-3 flex items-center gap-3"><button onClick={()=>sSs(false)} className="text-slate-300 text-sm">\u2190 Back</button><span className="font-bold text-sm">My Settings</span></header><main className="flex-1 p-4"><VolSet au={au} logout={logout}/></main></div>;
    return <div className="min-h-screen bg-slate-50 flex flex-col">
      <header className="no-print bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-10"><div className="flex items-center gap-2"><span className="text-xl">\ud83d\udc3e</span><div><div className="font-bold text-sm">Zaenid Michis</div><div className="text-slate-400 text-xs">Hi, {per.name}!</div></div></div><div className="flex gap-2"><button onClick={()=>sSs(true)} className="text-slate-400 text-xs border border-slate-600 px-3 py-1.5 rounded-lg">\u2699\ufe0f</button><button onClick={logout} className="text-slate-400 text-xs border border-slate-600 px-3 py-1.5 rounded-lg">Sign out</button></div></header>
      <main className="flex-1 overflow-auto pb-20">
        {tab==="care"&&<CareTab per={per} dat={dat} isCoord={false}/>}
        {tab==="tasks"&&<VolTasks tasks={mt} dat={dat} save={save}/>}
      </main>
      <nav className="no-print fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex z-10">
        <button onClick={()=>sTab("care")} className={`flex-1 py-2.5 flex flex-col items-center gap-0.5 ${tab==="care"?"text-teal-600":"text-slate-400"}`}><span className="text-xl leading-none">\ud83d\udc3e</span><span className="text-[10px] font-medium">Daily Care</span></button>
        <button onClick={()=>sTab("tasks")} className={`flex-1 py-2.5 flex flex-col items-center gap-0.5 relative ${tab==="tasks"?"text-teal-600":"text-slate-400"}`}><span className="text-xl leading-none">\ud83d\udccb</span><span className="text-[10px] font-medium">My Tasks</span>{mt.filter(t=>!t.done).length>0&&<span className="absolute top-1 right-6 bg-red-500 text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">{mt.filter(t=>!t.done).length}</span>}</button>
      </nav>
    </div>;
  }

  function VolTasks({tasks,dat,save}){
    const tog=async id=>save("tasks",dat.tasks.map(t=>t.id===id?{...t,done:!t.done,doneAt:new Date().toISOString()}:t));
    return <div className="p-4 space-y-3">
      <h2 className="text-base font-bold text-slate-800">My Special Tasks \u2014 Today</h2>
      {tasks.length===0?<Empty icon="\u2705" title="No special tasks today" subtitle="Your coordinator will assign tasks here if needed."/>:tasks.map(t=><div key={t.id} onClick={()=>tog(t.id)} className={`bg-white rounded-2xl border shadow-sm p-4 flex items-center gap-3 cursor-pointer ${t.done?"border-emerald-200 bg-emerald-50":""}`}><div className={`w-7 h-7 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${t.done?"bg-emerald-500 border-emerald-500":"border-slate-300"}`}>{t.done&&<span className="text-white text-xs font-bold">\u2713</span>}</div><div className="flex-1"><p className={`font-semibold text-sm ${t.done?"line-through text-slate-400":"text-slate-800"}`}>{t.type}</p>{t.note&&<p className="text-xs text-slate-400 mt-0.5">{t.note}</p>}{t.done&&t.doneAt&&<p className="text-xs text-emerald-600 mt-0.5">Done at {fmtT(t.doneAt)}</p>}</div></div>)}
    </div>;
  }

  function VolSet({au,logout}){
    const [np,sNp]=useState(""),[cp,sCp]=useState(""),[msg,sMsg]=useState(null),[busy,sBusy]=useState(false);
    const chg=async()=>{sMsg(null);if(np.length<6){sMsg({ok:false,t:"Min. 6 characters."});return;}if(np!==cp){sMsg({ok:false,t:"Don't match."});return;}sBusy(true);try{await au.updatePassword(np);sNp("");sCp("");sMsg({ok:true,t:"Password updated!"});}catch(e){if(e.code==="auth/requires-recent-login"){await FAUTH.sendPasswordResetEmail(au.email);sMsg({ok:true,t:"Reset email sent."});}else sMsg({ok:false,t:"Couldn't update."});}sBusy(false);};
    return <div className="space-y-4"><div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 space-y-3"><h3 className="font-semibold text-slate-700 text-sm">\ud83d\udd10 Change My Password</h3><div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">New password</label><input type="password" value={np} onChange={e=>sNp(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white" placeholder="Min. 6 characters"/></div><div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Confirm</label><input type="password" value={cp} onChange={e=>sCp(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white" placeholder="Repeat"/></div>{msg&&<div className={`text-sm px-3 py-2 rounded-xl ${msg.ok?"bg-emerald-100 text-emerald-700":"bg-red-100 text-red-600"}`}>{msg.t}</div>}<button onClick={chg} disabled={busy} className="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-sm disabled:opacity-50">{busy?"Updating\u2026":"Update Password"}</button></div><button onClick={logout} className="w-full text-slate-500 text-sm font-medium py-2">Sign out</button></div>;
  }

  function Empty({icon,title,subtitle}){return <div className="text-center py-14"><div className="text-5xl mb-3">{icon}</div><p className="font-semibold text-slate-700">{title}</p>{subtitle&&<p className="text-sm text-slate-400 mt-1">{subtitle}</p>}</div>;}

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

    async patch(k,v){try{await FDB.ref(k).update(v);}catch(e){console.error(e);}},

  // ── ROOT APP ────────────────────────────────────────────────────

    const [authUser, setAuthUser ]=useState(null);
    const [person,   setPerson   ]=useState(null);
    const [data,     setData     ]=useState({people:{},catPhotos:{},tasks:[]});

      const raw=await db.get("sag_people");
      const stored=(raw&&typeof raw==="object"&&!Array.isArray(raw))?raw:{};
      const merged={...stored};
      Object.entries(SEED_PEOPLE).forEach(([u,p])=>{merged[u]={...p,...(stored[u]||{}),protected:true};});
      const d={people:merged,catPhotos:(await db.get("sag_cat_photos"))??{},tasks:(await db.get("sag_tasks"))??[]};
      setData(d);return d;
    };

    useEffect(()=>{
      const unsub=FAUTH.onAuthStateChanged(async u=>{
        if(!u){setAuthUser(null);setPerson(null);setAuthState("signedOut");return;}
        setAuthUser(u);
        const d=await loadData();
        const p=d.people[u.uid];
        if(!p){setPerson({notRegistered:true,email:u.email});setAuthState("signedIn");return;}
        if(p.active===false){setPerson({deactivated:true,email:u.email});setAuthState("signedIn");return;}
        setPerson({...p,uid:u.uid});setAuthState("signedIn");
      });
      return()=>unsub();
    },[]);

    const save=async(key,value)=>{
      const km={people:"sag_people",catPhotos:"sag_cat_photos",tasks:"sag_tasks"};
      setData(p=>({...p,[key]:value}));
      await db.set(km[key],value);
    };

    if(authState==="signedOut") return <LoginScreen/>;

  // ── Login ─────────────────────────────────────────────────────
  function LoginScreen(){
    const [email,setEmail]=useState("");const [pass,setPass]=useState("");
    const [err,setErr]=useState("");const [busy,setBusy]=useState(false);const [rmsg,setRmsg]=useState("");
    const submit=async()=>{
      setErr("");setRmsg("");
      if(!email.trim()||!pass){setErr("Enter your email and password.");return;}
      setBusy(true);
      try{await FAUTH.signInWithEmailAndPassword(email.trim(),pass);}
      catch(e){const m={"auth/invalid-credential":"Incorrect email or password.","auth/wrong-password":"Incorrect password.","auth/user-not-found":"No account found.","auth/too-many-requests":"Too many attempts. Try later."};setErr(m[e.code]||"Couldn't sign in.");}
      setBusy(false);
    };
    const forgot=async()=>{
      setErr("");setRmsg("");
      if(!email.trim()){setErr("Enter your email first.");return;}
      setBusy(true);
      try{await FAUTH.sendPasswordResetEmail(email.trim());setRmsg("✅ Reset email sent! Check your inbox.");}
      catch{setErr("Couldn't send reset email.");}
      setBusy(false);
    };
    return(<div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-6">
      <div className="w-full max-w-sm">
        <div className="text-center mb-8"><div className="text-7xl mb-4">🐾</div><h1 className="text-3xl font-bold text-white">Zaenid Michis</h1><p className="text-slate-400 mt-2 text-sm">Cat Care Center</p></div>

          <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Password</label>
            <input type="password" value={pass} onChange={e=>{setPass(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••" className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500"/></div>
          {err&&<p className="text-red-500 text-sm">{err}</p>}
          {rmsg&&<p className="text-emerald-600 text-sm">{rmsg}</p>}
          <button onClick={submit} disabled={busy} className="w-full bg-slate-900 text-white font-semibold py-3.5 rounded-xl text-sm disabled:opacity-50">{busy?"Please wait…":"Sign In"}</button>
          <button onClick={forgot} disabled={busy} className="w-full text-teal-600 text-sm font-medium py-1">Forgot password?</button>
        </div>
      </div>
    </div>);
  }

  // ── DAILY CARE TAB ──────────────────────────────────────────────
  function DailyCarTab({person,data,isCoord}){
    const [date,setDate]=useState(todayISO());
    const [records,setRecords]=useState({});
    const [search,setSearch]=useState("");
    const [filter,setFilter]=useState("all"); // all | urgent | pending
    const [selected,setSelected]=useState(null); // cat being edited
    const [genNotes,setGenNotes]=useState("");
    const unsubRef=useRef(null);

    useEffect(()=>{
      if(unsubRef.current) unsubRef.current();
      const unsub=db.listen(`sag_daily/${date}`,val=>{setRecords(val||{});});
      unsubRef.current=unsub;
      db.get(`sag_daily_notes/${date}`).then(n=>setGenNotes(n?.notes||""));
      return()=>{ if(unsubRef.current) unsubRef.current(); };
    },[date]);

    const markField=async(catId,field,value)=>{
      const now=new Date().toISOString();
      const patch={[field]:value,updatedBy:person.name,updatedAt:now};
      setRecords(r=>({...r,[catId]:{...(r[catId]||{}),updatedBy:person.name,updatedAt:now,[field]:value}}));
      await db.patch(`sag_daily/${date}/${catId}`,patch);
    };

    const saveNotes=async(notes)=>{
      setGenNotes(notes);
      await db.set(`sag_daily_notes/${date}`,{notes,updatedBy:person.name,updatedAt:new Date().toISOString()});
    };

    const urgents=CATS.filter(c=>records[c.id]?.urgent);

    const filtered=CATS.filter(c=>{
      if(search&&!c.name.toLowerCase().includes(search.toLowerCase())&&!String(c.n).includes(search)) return false;
      if(filter==="urgent"&&!records[c.id]?.urgent) return false;
      if(filter==="pending"){const r=records[c.id];if(r?.am&&r?.pm) return false;}
      return true;
    });

    const doPrint=()=>{
      const rows=CATS.map(c=>{
        const r=records[c.id]||{};
        return `<tr style="border-bottom:1px solid #eee;">
          <td style="padding:4px 6px;text-align:center">${c.n}</td>
          <td style="padding:4px 6px">${c.name}${r.urgent?` <span style="color:red;font-weight:bold">⚠️</span>`:""}</td>
          <td style="padding:4px 6px;text-align:center">${r.am?"✓":""}</td>
          <td style="padding:4px 6px;text-align:center">${r.pm?"✓":""}</td>
          <td style="padding:4px 6px;text-align:center">${r.ate?"✓":""}</td>
          <td style="padding:4px 6px;text-align:center">${r.water?"✓":""}</td>
          <td style="padding:4px 6px;text-align:center">${r.litter?"✓":""}</td>
          <td style="padding:4px 6px;text-align:center">${r.med?"✓":""}</td>
          <td style="padding:4px 6px;font-size:11px">${r.careNotes||""}</td>
          <td style="padding:4px 6px;font-size:11px">${r.medNotes||""}</td>
        </tr>`;
      }).join("");
      const html=`<h2 style="margin:0 0 4px">Zaenid Michis — Daily Care Report</h2>
        <p style="margin:0 0 12px;color:#666">${fmtDate(date)} | Total: ${CATS.length} cats</p>
        ${urgents.length?`<p style="color:red;margin-bottom:8px;font-weight:bold">⚠️ URGENT: ${urgents.map(c=>c.name).join(", ")}</p>`:""}
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="background:#0f172a;color:white">
            <th style="padding:6px">#</th><th style="padding:6px;text-align:left">Name</th>
            <th style="padding:6px">AM</th><th style="padding:6px">PM</th>
            <th style="padding:6px">Ate</th><th style="padding:6px">Water</th>
            <th style="padding:6px">Litter</th><th style="padding:6px">Med</th>
            <th style="padding:6px;text-align:left">Care notes</th>
            <th style="padding:6px;text-align:left">Medical notes</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${genNotes?`<p style="margin-top:16px"><strong>General notes:</strong> ${genNotes}</p>`:""}`;
      document.getElementById("printArea").innerHTML=html;
      window.print();
    };

    const doUrgentPrint=()=>{
      if(!urgents.length){alert("No urgent cats today.");return;}
      const rows=urgents.map(c=>{const r=records[c.id]||{};return`<tr style="background:#fff3f3;border-bottom:1px solid #fca5a5"><td style="padding:6px 8px">${c.n}. ${c.name}</td><td style="padding:6px 8px">${r.careNotes||"—"}</td><td style="padding:6px 8px">${r.medNotes||"—"}</td><td style="padding:6px 8px;font-size:11px">${r.updatedBy||""}${r.updatedAt?" at "+fmtTime(r.updatedAt):""}</td></tr>`;}).join("");
      const html=`<h2 style="color:red;margin:0 0 4px">⚠️ URGENT CATS — ${fmtDate(date)}</h2>
        <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:12px">
          <thead><tr style="background:#ef4444;color:white"><th style="padding:6px;text-align:left">Cat</th><th style="padding:6px;text-align:left">Care notes</th><th style="padding:6px;text-align:left">Medical notes</th><th style="padding:6px;text-align:left">Marked by</th></tr></thead>
          <tbody>${rows}</tbody>

      document.getElementById("printArea").innerHTML=html;
      window.print();
    };

    return(<div className="flex flex-col h-full">
      {/* Header controls */}
      <div className="no-print sticky top-0 bg-white border-b border-slate-100 z-10 px-4 py-3 space-y-2">
        <div className="flex items-center gap-2">
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400"/>
          <button onClick={doPrint} className="text-xs bg-slate-100 text-slate-700 px-3 py-2 rounded-lg font-semibold flex-shrink-0">🖨️ Report</button>
          {urgents.length>0&&<button onClick={doUrgentPrint} className="text-xs bg-red-100 text-red-700 px-3 py-2 rounded-lg font-semibold flex-shrink-0">🚨 Urgent</button>}
        </div>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search cat by name or number…" className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400"/>
        <div className="flex gap-1.5">
          {[["all","All 128"],["urgent","🚨 Urgent"],["pending","○ Pending"]].map(([f,l])=>(
            <button key={f} onClick={()=>setFilter(f)} className={`flex-1 py-1.5 rounded-lg text-xs font-semibold transition-colors ${filter===f?"bg-slate-900 text-white":"bg-slate-100 text-slate-600"}`}>{l}</button>
          ))}
        </div>
        {urgents.length>0&&<div className="bg-red-50 border border-red-200 rounded-xl px-3 py-2"><p className="text-red-700 text-xs font-bold">⚠️ URGENT: {urgents.map(c=>c.name).join(", ")}</p></div>}
      </div>

      {/* Cat list */}
      <div className="flex-1 overflow-auto">
        {filtered.length===0?(<div className="text-center py-12 text-slate-400"><div className="text-4xl mb-2">🔍</div><p>No cats match your filter.</p></div>)
        :(<div className="divide-y divide-slate-100">
          {filtered.map(cat=>{
            const r=records[cat.id]||{};
            const photo=data.catPhotos?.[cat.id];
            const isUrgent=!!r.urgent;
            return(<div key={cat.id} onClick={()=>setSelected(cat)} className={`flex items-center gap-3 px-4 py-3 cursor-pointer active:bg-slate-50 ${isUrgent?"bg-red-50 border-l-4 border-red-500":""}`}>
              {photo?<img src={photo} alt={cat.name} className="w-10 h-10 rounded-full object-cover flex-shrink-0"/>:<div className="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center flex-shrink-0 text-xs font-bold text-slate-500">{cat.n}</div>}
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-1.5">
                  <span className="font-semibold text-sm text-slate-800">{cat.name}</span>
                  {isUrgent&&<span className="text-xs bg-red-500 text-white px-1.5 py-0.5 rounded-full font-bold">⚠️ URGENT</span>}
                </div>
                <div className="flex gap-2 mt-1">
                  {[["AM",r.am,"☀️"],["PM",r.pm,"🌙"],["Ate",r.ate,"🍽️"],["💧",r.water,"💧"],["🪣",r.litter,"🪣"],["Med",r.med,"💊"]].map(([label,val,icon])=>(
                    <span key={label} className={`text-xs font-semibold ${val?"text-emerald-600":"text-slate-300"}`}>{icon}</span>
                  ))}
                </div>
              </div>
              <span className="text-slate-300 text-sm flex-shrink-0">›</span>
            </div>);
          })}
        </div>)}

        {/* General notes */}
        <div className="p-4">
          <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">General shift notes</label>
          <textarea value={genNotes} onChange={e=>saveNotes(e.target.value)} rows={3} placeholder="Any general observations for this day…" className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white"/>
        </div>
      </div>

      {/* Cat detail modal */}
      {selected&&<CatModal cat={selected} record={records[selected.id]||{}} photo={data.catPhotos?.[selected.id]} personName={person.name} onMark={markField} onClose={()=>setSelected(null)}/>}
    </div>);
  }

  // ── TASKS TAB (special tasks) ───────────────────────────────────
  function TasksTab({data,save,person}){
    const [form,setForm]=useState(null);
    const [newType,setNewType]=useState("");
    const [newPerson,setNewPerson]=useState("");
    const [newNote,setNewNote]=useState("");
    const [flash,setFlash]=useState(null);
    const today=todayISO();

    const activePeople=Object.values(data.people||{}).filter(p=>p.active!==false);
    const todayTasks=data.tasks.filter(t=>t.date===today);

    const addTask=async()=>{
      if(!newType||!newPerson){setFlash({ok:false,msg:"Select task type and volunteer."});return;}
      const p=activePeople.find(x=>x.uid===newPerson);
      const task={id:uid(),date:today,type:newType,personId:newPerson,personName:p?.name||"",note:newNote,done:false,createdAt:new Date().toISOString()};
      await save("tasks",[...data.tasks,task]);
      setNewType("");setNewPerson("");setNewNote("");
      setFlash({ok:true,msg:"Task assigned!"});
      setTimeout(()=>setFlash(null),2000);
    };

    const toggleDone=async(id)=>{
      await save("tasks",data.tasks.map(t=>t.id===id?{...t,done:!t.done}:t));
    };

    const deleteTask=async(id)=>{
      await save("tasks",data.tasks.filter(t=>t.id!==id));
    };

    return(<div className="p-4 space-y-4">
      <h2 className="text-base font-bold text-slate-800">Special Tasks — Today</h2>
      {flash&&<div className={`text-sm px-4 py-3 rounded-xl font-medium ${flash.ok?"bg-emerald-100 text-emerald-700":"bg-red-100 text-red-600"}`}>{flash.msg}</div>}

      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 space-y-3">
        <h3 className="font-semibold text-slate-700 text-sm">Assign a special task</h3>
        <div>
          <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Task Type</label>
          <select value={newType} onChange={e=>setNewType(e.target.value)} className={IC}>
            <option value="">— Select —</option>
            {SPECIAL_TASKS.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <div>
          <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Assign to</label>
          <select value={newPerson} onChange={e=>setNewPerson(e.target.value)} className={IC}>
            <option value="">— Select volunteer —</option>
            {activePeople.map(p=><option key={p.uid} value={p.uid}>{p.name}</option>)}
          </select>
        </div>
        <div>
          <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Notes (optional)</label>
          <input value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Additional details…" className={IC}/>
        </div>
        <button onClick={addTask} className="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-sm">Assign Task</button>
      </div>

      {todayTasks.length===0?<Empty icon="📋" title="No special tasks today" subtitle="Assign tasks above."/>
      :<div className="space-y-2">{todayTasks.map(t=>(
        <div key={t.id} className={`bg-white rounded-2xl border shadow-sm p-4 ${t.done?"border-emerald-200 bg-emerald-50 opacity-70":"border-slate-100"}`}>
          <div className="flex items-start justify-between">
            <div className="flex-1">
              <p className={`font-semibold text-sm ${t.done?"line-through text-slate-400":"text-slate-800"}`}>{t.type}</p>
              <p className="text-xs text-slate-500 mt-0.5">→ {t.personName}</p>
              {t.note&&<p className="text-xs text-slate-400 mt-1 italic">{t.note}</p>}
            </div>
            <div className="flex items-center gap-2 ml-3">
              <button onClick={()=>toggleDone(t.id)} className={`text-xs px-2.5 py-1 rounded-full font-bold ${t.done?"bg-emerald-500 text-white":"bg-slate-100 text-slate-600"}`}>{t.done?"✓ Done":"Mark done"}</button>
              <button onClick={()=>deleteTask(t.id)} className="text-red-300 text-lg font-bold">×</button>
            </div>
          </div>
        </div>
      ))}</div>}
    </div>);
  }

  // ── CATS PHOTO TAB ──────────────────────────────────────────────

  // ── PEOPLE TAB ──────────────────────────────────────────────────
  function PeopleTab({data,save,currentUid}){
    const [mode,setMode]=useState("list");const [editing,setEditing]=useState(null);
    const [form,setForm]=useState({});const [err,setErr]=useState("");const [showArchived,setShowArchived]=useState(false);
    const peopleArr=Object.values(data.people||{});
    const activePeople=peopleArr.filter(p=>p.active!==false);
    const archivedPeople=peopleArr.filter(p=>p.active===false);
    const shown=showArchived?archivedPeople:activePeople;
    const openNew=()=>{setForm({name:"",uid:"",email:"",role:"volunteer",active:true});setEditing("new");setMode("form");setErr("");};
    const openEdit=p=>{setForm({...p});setEditing(p);setMode("form");setErr("");};
    const close=()=>{setMode("list");setEditing(null);setForm({});setErr("");};
    const setF=(k,v)=>setForm(p=>({...p,[k]:v}));
    const handleSave=async()=>{
      if(!form.name?.trim()){setErr("Name is required.");return;}
      if(!form.uid?.trim()){setErr("Firebase UID is required.");return;}
      if(!form.email?.trim()){setErr("Email is required.");return;}
      if(editing==="new"&&data.people[form.uid]){setErr("That UID already exists.");return;}
      const updated={...data.people,[form.uid]:{...form}};
      await save("people",updated);close();
    };
    const archivePerson=async p=>{const u={...data.people,[p.uid]:{...p,active:!p.active}};await save("people",u);};
    const deletePerson=async p=>{
      if(p.protected){alert("This account is protected and cannot be removed here.");return;}
      if(!window.confirm(`Remove ${p.name}? Their Firebase login still exists.`))return;
      const u={...data.people};delete u[p.uid];await save("people",u);
    };
    if(mode==="form")return(<div className="p-4 space-y-4">
      <div className="flex items-center gap-3 mb-2"><button onClick={close} className="text-teal-600 text-sm font-medium">← Back</button><h2 className="text-base font-bold text-slate-800">{editing==="new"?"Add Person":"Edit Person"}</h2></div>
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 space-y-3">
        <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Full Name *</label><input value={form.name||""} onChange={e=>setF("name",e.target.value)} className={IC} placeholder="Maria González"/></div>
        <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Email *</label><input type="email" value={form.email||""} onChange={e=>setF("email",e.target.value)} className={IC} placeholder="maria@email.com"/></div>
        {editing==="new"&&<div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Firebase UID *</label><input value={form.uid||""} onChange={e=>setF("uid",e.target.value)} className={IC} placeholder="From Firebase Authentication"/><p className="text-xs text-slate-400 mt-1">Firebase Console → Authentication → Users → copy the UID.</p></div>}
        <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Role</label><select value={form.role||"volunteer"} onChange={e=>setF("role",e.target.value)} className={IC}><option value="volunteer">Volunteer</option><option value="coordinator">Coordinator</option></select></div>
        {err&&<div className="text-sm text-red-600 bg-red-50 px-3 py-2 rounded-xl">{err}</div>}
      </div>
      <button onClick={handleSave} className="w-full bg-slate-900 text-white font-semibold py-4 rounded-2xl text-sm">Save Person</button>
    </div>);
    return(<div className="p-4 space-y-4">
      <div className="flex items-center justify-between"><h2 className="text-base font-bold text-slate-800">People ({shown.length})</h2><button onClick={openNew} className="bg-slate-900 text-white text-xs px-4 py-2 rounded-xl font-medium">+ Add</button></div>
      <div className="flex rounded-xl overflow-hidden border border-slate-200">
        <button onClick={()=>setShowArchived(false)} className={`flex-1 py-2 text-xs font-bold ${!showArchived?"bg-slate-900 text-white":"bg-white text-slate-500"}`}>Active ({activePeople.length})</button>
        <button onClick={()=>setShowArchived(true)} className={`flex-1 py-2 text-xs font-bold ${showArchived?"bg-slate-900 text-white":"bg-white text-slate-500"}`}>Archived ({archivedPeople.length})</button>
      </div>
      {shown.length===0?<Empty icon="👤" title={showArchived?"No archived people":"No people yet"} subtitle=""/>
      :shown.map(p=>(<div key={p.uid} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
        <div className="flex items-center justify-between">
          <div className="min-w-0">
            <div className="font-semibold text-slate-800 flex items-center gap-1.5">{p.name}{p.uid===currentUid&&<span className="text-xs text-teal-600 font-normal">(you)</span>}{p.protected&&<span className="text-xs text-amber-600">🔒</span>}</div>
            <div className="text-sm text-slate-400 mt-0.5 truncate">{p.email}</div>
            <span className={`inline-block mt-1.5 text-xs px-2.5 py-0.5 rounded-full font-medium capitalize ${p.role==="coordinator"?"bg-indigo-100 text-indigo-700":"bg-slate-100 text-slate-600"}`}>{p.role}</span>
          </div>
          <div className="flex flex-col items-end gap-1.5 ml-3 flex-shrink-0">
            <button onClick={()=>openEdit(p)} className="text-xs text-teal-600 font-medium">Edit</button>
            {!p.protected&&<button onClick={()=>archivePerson(p)} className="text-xs text-slate-400">{showArchived?"Unarchive":"Archive"}</button>}
            {!p.protected&&<button onClick={()=>deletePerson(p)} className="text-xs text-red-400">Delete</button>}
          </div>
        </div>
      </div>))}
    </div>);
  }

  // ── HISTORY TAB ─────────────────────────────────────────────────
  function HistoryTab({data,person}){
    const [date,setDate]=useState(todayISO());
    const [records,setRecords]=useState({});
    const [notes,setNotes]=useState("");
    const unsubRef=useRef(null);
    useEffect(()=>{
      if(unsubRef.current)unsubRef.current();
      const unsub=db.listen(`sag_daily/${date}`,val=>setRecords(val||{}));
      unsubRef.current=unsub;
      db.get(`sag_daily_notes/${date}`).then(n=>setNotes(n?.notes||""));
      return()=>{if(unsubRef.current)unsubRef.current();};
    },[date]);

    const doPrint=()=>{
      const rows=CATS.map(c=>{const r=records[c.id]||{};return`<tr style="border-bottom:1px solid #eee"><td style="padding:4px 6px;text-align:center">${c.n}</td><td style="padding:4px 6px">${c.name}${r.urgent?` <b style="color:red">⚠️</b>`:""}</td><td style="padding:4px 6px;text-align:center">${r.am?"✓":""}</td><td style="padding:4px 6px;text-align:center">${r.pm?"✓":""}</td><td style="padding:4px 6px;text-align:center">${r.ate?"✓":""}</td><td style="padding:4px 6px;text-align:center">${r.water?"✓":""}</td><td style="padding:4px 6px;text-align:center">${r.litter?"✓":""}</td><td style="padding:4px 6px;text-align:center">${r.med?"✓":""}</td><td style="padding:4px 6px;font-size:11px">${r.careNotes||""}</td><td style="padding:4px 6px;font-size:11px">${r.medNotes||""}</td></tr>`;}).join("");
      const html=`<h2>Zaenid Michis — Care History</h2><p style="color:#666">${fmtDate(date)}</p>
        <table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:12px">
          <thead><tr style="background:#0f172a;color:white"><th style="padding:6px">#</th><th style="padding:6px;text-align:left">Name</th><th style="padding:6px">AM</th><th style="padding:6px">PM</th><th style="padding:6px">Ate</th><th style="padding:6px">Water</th><th style="padding:6px">Litter</th><th style="padding:6px">Med</th><th style="padding:6px;text-align:left">Care Notes</th><th style="padding:6px;text-align:left">Medical Notes</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>${notes?`<p style="margin-top:16px"><strong>General notes:</strong> ${notes}</p>`:""}`;
      document.getElementById("printArea").innerHTML=html;window.print();
    };

    const visited=CATS.filter(c=>records[c.id]?.am||records[c.id]?.pm).length;
    const urgents=CATS.filter(c=>records[c.id]?.urgent);

    return(<div className="p-4 space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-base font-bold text-slate-800">History</h2>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="border border-slate-200 rounded-xl px-3 py-1.5 text-sm focus:outline-none bg-white"/>
      </div>
      <div className="grid grid-cols-3 gap-2">
        <div className="bg-white rounded-2xl border border-slate-100 p-3 text-center"><p className="text-2xl font-black text-teal-600">{visited}</p><p className="text-xs text-slate-500">Cats visited</p></div>
        <div className="bg-white rounded-2xl border border-slate-100 p-3 text-center"><p className="text-2xl font-black text-slate-700">{CATS.length-visited}</p><p className="text-xs text-slate-500">Not checked</p></div>
        <div className="bg-white rounded-2xl border border-slate-100 p-3 text-center"><p className={`text-2xl font-black ${urgents.length?"text-red-500":"text-emerald-500"}`}>{urgents.length}</p><p className="text-xs text-slate-500">Urgent</p></div>
      </div>
      {urgents.length>0&&<div className="bg-red-50 border border-red-200 rounded-2xl p-3"><p className="text-red-700 text-xs font-bold mb-1">⚠️ URGENT</p>{urgents.map(c=><p key={c.id} className="text-xs text-red-600">{c.n}. {c.name}{records[c.id]?.medNotes?` — ${records[c.id].medNotes}`:""}</p>)}</div>}
      {notes&&<div className="bg-slate-50 border border-slate-200 rounded-2xl p-3"><p className="text-xs font-semibold text-slate-500 mb-1">General notes</p><p className="text-sm text-slate-700">{notes}</p></div>}
      <button onClick={doPrint} className="w-full bg-slate-100 text-slate-700 font-semibold py-3 rounded-xl text-sm">🖨️ Print Full Report for {fmtDate(date)}</button>
    </div>);
  }

  // ── SETTINGS TAB ────────────────────────────────────────────────
  function SettingsTab({data,save,authUser}){
    const [newPass,setNewPass]=useState("");const [confirm,setConfirm]=useState("");
    const [msg,setMsg]=useState(null);const [busy,setBusy]=useState(false);
    const [confirmText,setConfirmText]=useState("");const [dangerMsg,setDangerMsg]=useState(null);
    const changePassword=async()=>{
      setMsg(null);
      if(newPass.length<6){setMsg({ok:false,text:"Password must be at least 6 characters."});return;}
      if(newPass!==confirm){setMsg({ok:false,text:"Passwords do not match."});return;}
      setBusy(true);
      try{await authUser.updatePassword(newPass);setNewPass("");setConfirm("");setMsg({ok:true,text:"Password updated!"});}
      catch(e){if(e.code==="auth/requires-recent-login"){await FAUTH.sendPasswordResetEmail(authUser.email);setMsg({ok:true,text:"Security check required — we sent a reset email instead."});}else setMsg({ok:false,text:"Couldn't update. Try again."});}
      setBusy(false);
    };
    const wipeDailyRecords=async()=>{
      if(confirmText!=="DELETE"){setDangerMsg("Type DELETE to confirm.");return;}
      // We can't delete all sag_daily/* easily, but we can note this limitation
      setDangerMsg("Contact your database admin to clear historical records.");
      setConfirmText("");
    };
    return(<div className="p-4 space-y-4">
      <h2 className="text-base font-bold text-slate-800">Settings</h2>
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 space-y-3">
        <h3 className="font-semibold text-slate-700 text-sm">🔐 Change My Password</h3>
        <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">New password (min. 6 chars)</label><input type="password" value={newPass} onChange={e=>setNewPass(e.target.value)} className={IC} placeholder="New password"/></div>
        <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Confirm</label><input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} className={IC} placeholder="Repeat to confirm"/></div>
        {msg&&<div className={`text-sm px-3 py-2 rounded-xl ${msg.ok?"bg-emerald-100 text-emerald-700":"bg-red-100 text-red-600"}`}>{msg.text}</div>}
        <button onClick={changePassword} disabled={busy} className="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-sm disabled:opacity-50">{busy?"Updating…":"Update Password"}</button>
      </div>
      <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4 text-sm text-amber-800 leading-relaxed">
        <strong>💡 Adding volunteers:</strong> Create their login in Firebase Console first, then add them in the People tab using the same email and their Firebase UID.
      </div>
    </div>);
  }

  // ── VOLUNTEER APP ───────────────────────────────────────────────
  function VolApp({authUser,person,data,save,onLogout}){
    const [tab,setTab]=useState("care");
    const [showSettings,setShowSettings]=useState(false);
    if(showSettings)return(<div className="min-h-screen bg-slate-50 flex flex-col">
      <header className="bg-slate-900 text-white px-4 py-3 flex items-center gap-3"><button onClick={()=>setShowSettings(false)} className="text-slate-300 text-sm">← Back</button><span className="font-bold text-sm">My Settings</span></header>
      <main className="flex-1 p-4"><VolSettings authUser={authUser} onLogout={onLogout}/></main>
    </div>);
    const myTasks=data.tasks.filter(t=>t.date===todayISO()&&t.personId===person.uid);
    const urgentCount=0; // computed in DailyCarTab
    return(<div className="min-h-screen bg-slate-50 flex flex-col">
      <header className="no-print bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-10">
        <div className="flex items-center gap-2"><span className="text-xl">🐾</span><div><div className="font-bold text-sm">Zaenid Michis</div><div className="text-slate-400 text-xs">Hi, {person.name}!</div></div></div>
        <div className="flex gap-2">
          <button onClick={()=>setShowSettings(true)} className="text-slate-400 text-xs border border-slate-600 px-3 py-1.5 rounded-lg">⚙️</button>
          <button onClick={onLogout} className="text-slate-400 text-xs border border-slate-600 px-3 py-1.5 rounded-lg">Sign out</button>
        </div>
      </header>
      <main className="flex-1 overflow-auto pb-20">
        {tab==="care"&&<DailyCarTab person={person} data={data} isCoord={false}/>}
        {tab==="tasks"&&<VolTasks tasks={myTasks} data={data} save={save}/>}
      </main>
      <nav className="no-print fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex z-10">
        <button onClick={()=>setTab("care")} className={`flex-1 py-2.5 flex flex-col items-center gap-0.5 ${tab==="care"?"text-teal-600":"text-slate-400"}`}>
          <span className="text-xl leading-none">🐾</span><span className="text-[10px] font-medium">Daily Care</span>
        </button>
        <button onClick={()=>setTab("tasks")} className={`flex-1 py-2.5 flex flex-col items-center gap-0.5 relative ${tab==="tasks"?"text-teal-600":"text-slate-400"}`}>
          <span className="text-xl leading-none">📋</span><span className="text-[10px] font-medium">My Tasks</span>
          {myTasks.filter(t=>!t.done).length>0&&<span className="absolute top-1 right-6 bg-red-500 text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">{myTasks.filter(t=>!t.done).length}</span>}
        </button>
      </nav>
    </div>);
  }

  function VolTasks({tasks,data,save}){
    const toggle=async id=>{await save("tasks",data.tasks.map(t=>t.id===id?{...t,done:!t.done,doneAt:new Date().toISOString()}:t));};
    return(<div className="p-4 space-y-3">
      <h2 className="text-base font-bold text-slate-800">My Special Tasks — Today</h2>
      {tasks.length===0?<Empty icon="✅" title="No special tasks today" subtitle="Your coordinator will assign tasks here if needed."/>
      :tasks.map(t=><div key={t.id} onClick={()=>toggle(t.id)} className={`bg-white rounded-2xl border shadow-sm p-4 flex items-center gap-3 cursor-pointer ${t.done?"border-emerald-200 bg-emerald-50":""}`}>
        <div className={`w-7 h-7 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${t.done?"bg-emerald-500 border-emerald-500":"border-slate-300"}`}>
          {t.done&&<span className="text-white text-xs font-bold">✓</span>}
        </div>
        <div className="flex-1">
          <p className={`font-semibold text-sm ${t.done?"line-through text-slate-400":"text-slate-800"}`}>{t.type}</p>
          {t.note&&<p className="text-xs text-slate-400 mt-0.5">{t.note}</p>}
          {t.done&&t.doneAt&&<p className="text-xs text-emerald-600 mt-0.5">Done at {fmtTime(t.doneAt)}</p>}
        </div>
      </div>)}
    </div>);
  }

  function VolSettings({authUser,onLogout}){
    const [np,setNp]=useState("");const [cp,setCp]=useState("");const [msg,setMsg]=useState(null);const [busy,setBusy]=useState(false);
    const change=async()=>{
      setMsg(null);if(np.length<6){setMsg({ok:false,text:"Min. 6 characters."});return;}if(np!==cp){setMsg({ok:false,text:"Passwords don't match."});return;}
      setBusy(true);try{await authUser.updatePassword(np);setNp("");setCp("");setMsg({ok:true,text:"Password updated!"});}catch(e){if(e.code==="auth/requires-recent-login"){await FAUTH.sendPasswordResetEmail(authUser.email);setMsg({ok:true,text:"Reset email sent — use that to change your password."});}else setMsg({ok:false,text:"Couldn't update. Try again."});}setBusy(false);
    };
    return(<div className="space-y-4">
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 space-y-3">
        <h3 className="font-semibold text-slate-700 text-sm">🔐 Change My Password</h3>
        <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">New password</label><input type="password" value={np} onChange={e=>setNp(e.target.value)} className={IC} placeholder="Min. 6 characters"/></div>
        <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Confirm</label><input type="password" value={cp} onChange={e=>setCp(e.target.value)} className={IC} placeholder="Repeat"/></div>
        {msg&&<div className={`text-sm px-3 py-2 rounded-xl ${msg.ok?"bg-emerald-100 text-emerald-700":"bg-red-100 text-red-600"}`}>{msg.text}</div>}
        <button onClick={change} disabled={busy} className="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-sm disabled:opacity-50">{busy?"Updating…":"Update Password"}</button>
      </div>
      <button onClick={onLogout} className="w-full text-slate-500 text-sm font-medium py-2">Sign out</button>
    </div>);
  }

  // ── Shared ──────────────────────────────────────────────────────
  const IC="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white";
  function Empty({icon,title,subtitle}){return(<div className="text-center py-14"><div className="text-5xl mb-3">{icon}</div><p className="font-semibold text-slate-700">{title}</p>{subtitle&&<p className="text-sm text-slate-400 mt-1">{subtitle}</p>}</div>);}

  // ── Render ──────────────────────────────────────────────────────
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

function careView(){const urgent=CATS.filter(c=>state.daily[c.id]?.urgent);const visible=CATS.filter(c=>{const r=state.daily[c.id]||{};if(state.search&&!c.name.toLowerCase().includes(state.search.toLowerCase())&&!String(c.n).includes(state.search))return false;if(state.filter==='urgent'&&!r.urgent)return false;if(state.filter==='pending'&&r.am&&r.pm)return false;return true});return `<div class="toolbar no-print"><div class="row"><input id="careDate" class="input grow" type="date" value="${state.date}"><button class="btn small" data-act="print">🖨️ Print</button></div><input id="search" class="input mt8" placeholder="🔍 Search cat by name or number…" value="${esc(state.search)}"><div class="filters">${[['all','All 128'],['urgent','⚠️ Urgent'],['pending','○ Pending']].map(([f,l])=>`<button class="filter ${state.filter===f?'on':''}" data-filter="${f}">${l}</button>`).join('')}</div>${urgent.length?`<div class="urgentbox">⚠️ URGENT: ${urgent.map(c=>esc(c.name)).join(', ')}</div>`:''}</div><div class="list">${visible.map(cat=>catRow(cat)).join('')}</div><div class="notesbox"><div class="field"><label>General shift notes</label><textarea id="dailyNotes" class="input" rows="3" placeholder="Any general observations for this day…">${esc(state.dailyNotes)}</textarea></div><div class="muted">Saved automatically after you stop typing.</div></div>`}
function catRow(cat){const r=state.daily[cat.id]||{},ph=state.catPhotos[cat.id];const badges=[['AM',r.am],['PM',r.pm],['Food',r.ate],['Water',r.water],['Litter',r.litter],['Med',r.med]];return `<div class="catrow ${r.urgent?'urgent':''}" data-cat="${cat.id}">${ph?`<img class="avatar" src="${esc(ph)}" alt="${esc(cat.name)}">`:`<div class="avatar">${cat.n}</div>`}<div class="catmain"><div class="catname">${esc(cat.name)} ${r.urgent?'<span class="badge urgent">URGENT</span>':''}</div><div class="badges">${badges.map(([l,v])=>`<span class="badge ${v?'done':''}">${v?'✓ ':''}${l}</span>`).join('')}</div></div><div class="chev">›</div></div>`}
function tasksView(){const today=localDate();const coord=state.person.role==='coordinator';const people=Object.values(state.people).filter(p=>p.active!==false);const tasks=state.tasks.filter(t=>t.date===today&&(coord||t.personId===state.person.uid));let add='';if(coord)add=`<div class="card mb12"><h3 class="smalltext">Assign a special task</h3><div class="field"><label>Task Type</label><select id="taskType" class="input"><option value="">— Select —</option>${STASKS.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Assign to</label><select id="taskPerson" class="input"><option value="">— Select —</option>${people.map(p=>`<option value="${esc(p.uid)}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Notes (optional)</label><input id="taskNote" class="input" placeholder="Details…"></div><button class="btn primary w100" data-act="addTask">Assign Task</button><div id="taskMsg"></div></div>`;return `<div class="page"><div class="title-row"><h2>${coord?'Special Tasks — Today':'My Special Tasks — Today'}</h2></div>${add}${tasks.length?tasks.map(t=>`<div class="card task ${t.done?'done':''}"><h4>${esc(t.type)}</h4>${coord?`<p>→ ${esc(t.personName||'')}</p>`:''}${t.note?`<p><em>${esc(t.note)}</em></p>`:''}${t.doneAt&&t.done?`<p class="tealtext">Done at ${fmtT(t.doneAt)}</p>`:''}<div class="task-actions"><button class="btn small ${t.done?'teal':''}" data-task-toggle="${esc(t._key)}">${t.done?'✓ Done':'Mark done'}</button>${coord?`<button class="btn small" data-task-del="${esc(t._key)}">Delete</button>`:''}</div></div>`).join(''):`<div class="empty"><div class="emoji">✅</div><b>No special tasks today</b></div>`}</div>`}
function catsView(){const q=state.search.toLowerCase();const vis=CATS.filter(c=>!q||c.name.toLowerCase().includes(q)||String(c.n).includes(q));return `<div class="page"><div class="title-row"><h2>Cat Photos (${CATS.length} cats)</h2></div><input id="catSearch" class="input mb12" placeholder="🔍 Search cat…" value="${esc(state.search)}"><div class="photo-grid">${vis.map(c=>{const ph=state.catPhotos[c.id];return `<div class="card photo-item">${ph?`<img class="avatar" src="${esc(ph)}" alt="${esc(c.name)}">`:`<div class="avatar">#${c.n}</div>`}<div class="grow"><b class="smalltext">${esc(c.name)}</b><div class="muted">${ph?'Photo added':'No photo yet'}</div></div><button class="btn small" data-photo="${c.id}">${ph?'Edit':'Add'}</button>${ph?`<button class="btn small" data-photo-remove="${c.id}">Remove</button>`:''}</div>`}).join('')}</div></div>`}
function peopleView(){const arr=Object.values(state.people),shown=arr.filter(p=>(p.active===false)===state.archived);return `<div class="page"><div class="title-row"><h2>People (${shown.length})</h2><button class="btn primary small" data-act="newPerson">+ Add</button></div><div class="split mb12"><button class="btn ${!state.archived?'primary':''}" data-archive="0">Active (${arr.filter(p=>p.active!==false).length})</button><button class="btn ${state.archived?'primary':''}" data-archive="1">Archived (${arr.filter(p=>p.active===false).length})</button></div>${shown.length?shown.map(p=>`<div class="card person"><div class="grow"><b>${esc(p.name||'')}</b>${p.uid===state.user.uid?' <span class="tealtext smalltext">(you)</span>':''}${p.protected?' 🔒':''}<div class="email">${esc(p.email||'')}</div><span class="pill">${esc(p.role||'volunteer')}</span></div><div><button class="btn small" data-person-edit="${esc(p.uid)}">Edit</button>${!p.protected?`<button class="btn small" data-person-archive="${esc(p.uid)}">${state.archived?'Unarchive':'Archive'}</button><button class="btn small" data-person-del="${esc(p.uid)}">Delete</button>`:''}</div></div>`).join(''):'<div class="empty"><div class="emoji">👤</div><b>No people here</b></div>'}</div>`}
function historyView(){const rec=state.daily;const visited=CATS.filter(c=>{const r=rec[c.id]||{};return r.am||r.pm||r.ate||r.water||r.litter||r.med||r.careNotes||r.medNotes}).length;const urg=CATS.filter(c=>rec[c.id]?.urgent);return `<div class="page"><div class="title-row"><h2>History</h2><input id="histDate" class="input" style="width:auto" type="date" value="${state.date}"></div><div class="stats mb12"><div class="card stat"><b class="tealtext">${visited}</b><span class="muted">Visited</span></div><div class="card stat"><b>${CATS.length-visited}</b><span class="muted">Pending</span></div><div class="card stat"><b class="${urg.length?'dangertext':'tealtext'}">${urg.length}</b><span class="muted">Urgent</span></div></div>${urg.length?`<div class="msg err"><b>⚠️ URGENT</b><br>${urg.map(c=>`${c.n}. ${esc(c.name)}${rec[c.id]?.medNotes?` — ${esc(rec[c.id].medNotes)}`:''}`).join('<br>')}</div>`:''}${state.dailyNotes?`<div class="card mb12"><b class="smalltext">General notes</b><p class="smalltext">${esc(state.dailyNotes)}</p></div>`:''}<button class="btn w100" data-act="print">🖨️ Print Full Report</button></div>`}
function settingsView(vol){return `<div class="page"><div class="title-row"><h2>${vol?'My Settings':'Settings'}</h2>${vol?'<button class="btn small" data-act="closeSettings">← Back</button>':''}</div><div class="card"><h3 class="smalltext">🔐 Change My Password</h3><div class="field"><label>New password (min. 6)</label><input id="newPw" type="password" class="input"></div><div class="field"><label>Confirm</label><input id="confirmPw" type="password" class="input"></div><button class="btn primary w100" data-act="changePw">Update Password</button><div id="settingsMsg"></div></div>${!vol?'<div class="msg warn mt12"><b>Adding volunteers:</b> Create their login in Firebase Authentication first, then add them in People with the same UID.</div>':''}</div>`}
function openCatModal(){const cat=CATS.find(c=>c.id===state.selectedCat);if(!cat)return;const r=state.daily[cat.id]||{},ph=state.catPhotos[cat.id];const modal=document.createElement('div');modal.className='modalbg';modal.id='catModal';modal.innerHTML=`<div class="modal"><div class="modalhead">${ph?`<img class="avatar" style="width:56px;height:56px;border-radius:14px" src="${esc(ph)}">`:`<div class="avatar" style="width:56px;height:56px;border-radius:14px">#${cat.n}</div>`}<div><h3>${esc(cat.name)}</h3><div class="muted">Cat #${cat.n}</div></div><button class="close" data-act="closeCat">×</button></div><button class="urgentbtn ${r.urgent?'on':''}" data-care="urgent">${r.urgent?'⚠️ URGENT — Tap to clear':'Mark as URGENT ⚠️'}</button><div class="checks">${[['am','☀️','AM'],['pm','🌙','PM'],['ate','🍽️','Food'],['water','💧','Water'],['litter','🪣','Litter'],['med','💊','Med']].map(([f,i,l])=>`<button class="check ${r[f]?'on':''}" data-care="${f}"><span class="emoji">${i}</span>${l}${r[f]?' ✓':''}</button>`).join('')}</div><div class="field"><label>📝 Care notes</label><textarea id="careNotes" class="input" rows="2">${esc(r.careNotes||'')}</textarea></div><div class="field"><label>🏥 Medical observations</label><textarea id="medNotes" class="input" rows="2">${esc(r.medNotes||'')}</textarea></div><button class="btn primary w100" data-act="saveCatNotes">Save Notes</button>${r.updatedBy?`<div class="muted mt8" style="text-align:center">Updated by <b>${esc(r.updatedBy)}</b>${r.updatedAt?' at '+fmtT(r.updatedAt):''}</div>`:''}</div>`;document.body.appendChild(modal);modal.addEventListener('click',e=>{if(e.target===modal){state.selectedCat=null;modal.remove()}else handleClick(e)})}
function openPhotoModal(){const cat=CATS.find(c=>c.id===state.photoCat);if(!cat)return;const ph=state.catPhotos[cat.id]||'';const modal=document.createElement('div');modal.className='modalbg';modal.id='photoModal';modal.innerHTML=`<div class="modal"><div class="modalhead"><h3>Photo — ${esc(cat.name)}</h3><button class="close" data-act="closePhoto">×</button></div><div class="field"><label>Direct Photo URL</label><input id="photoUrl" class="input" value="${esc(ph)}" placeholder="https://…"></div><div class="muted mb12">Use a direct image URL. Some Google Photos/Drive share links do not work as image links.</div><button class="btn primary w100" data-act="savePhoto">Save Photo</button></div>`;document.body.appendChild(modal);modal.addEventListener('click',e=>{if(e.target===modal){state.photoCat=null;modal.remove()}else handleClick(e)})}
function openPersonModal(){const isNew=state.editingPerson==='new';const p=isNew?{uid:'',name:'',email:'',role:'volunteer',active:true}:state.people[state.editingPerson];if(!p)return;const modal=document.createElement('div');modal.className='modalbg';modal.id='personModal';modal.innerHTML=`<div class="modal"><div class="modalhead"><h3>${isNew?'Add Person':'Edit Person'}</h3><button class="close" data-act="closePerson">×</button></div><div class="field"><label>Full Name *</label><input id="personName" class="input" value="${esc(p.name||'')}"></div><div class="field"><label>Email *</label><input id="personEmail" type="email" class="input" value="${esc(p.email||'')}"></div>${isNew?'<div class="field"><label>Firebase UID *</label><input id="personUid" class="input"><div class="muted mt8">Firebase Console → Authentication → Users → UID</div></div>':''}<div class="field"><label>Role</label><select id="personRole" class="input"><option value="volunteer" ${p.role!=='coordinator'?'selected':''}>Volunteer</option><option value="coordinator" ${p.role==='coordinator'?'selected':''}>Coordinator</option></select></div><div id="personMsg"></div><button class="btn primary w100" data-act="savePerson">Save Person</button></div>`;document.body.appendChild(modal);modal.addEventListener('click',e=>{if(e.target===modal){state.editingPerson=null;modal.remove()}else handleClick(e)})}
function bindDailyControls(){document.getElementById('careDate')?.addEventListener('change',e=>{state.date=e.target.value;bindDaily();render()});document.getElementById('search')?.addEventListener('input',e=>{state.search=e.target.value;render()});const notes=document.getElementById('dailyNotes');notes?.addEventListener('input',e=>{state.dailyNotes=e.target.value;clearTimeout(notesTimer);notesTimer=setTimeout(()=>db.set(`sag_daily_notes/${state.date}`,{notes:state.dailyNotes,by:state.person.name,at:new Date().toISOString()}),650)});notes?.addEventListener('blur',()=>{clearTimeout(notesTimer);db.set(`sag_daily_notes/${state.date}`,{notes:state.dailyNotes,by:state.person.name,at:new Date().toISOString()})})}
function renderNotesOnly(){const el=document.getElementById('dailyNotes');if(el&&document.activeElement!==el)el.value=state.dailyNotes||''}
async function markCare(field){const cat=state.selectedCat,r=state.daily[cat]||{},v=!r[field],now=new Date().toISOString();state.daily={...state.daily,[cat]:{...r,[field]:v,updatedBy:state.person.name,updatedAt:now}};await db.patch(`sag_daily/${state.date}/${cat}`,{[field]:v,updatedBy:state.person.name,updatedAt:now});document.getElementById('catModal')?.remove();state.selectedCat=cat;render();}
async function saveCatNotes(){const cat=state.selectedCat,now=new Date().toISOString();await db.patch(`sag_daily/${state.date}/${cat}`,{careNotes:document.getElementById('careNotes').value,medNotes:document.getElementById('medNotes').value,updatedBy:state.person.name,updatedAt:now});state.selectedCat=null;document.getElementById('catModal')?.remove();render()}
async function addTask(){const type=document.getElementById('taskType').value,pid=document.getElementById('taskPerson').value,note=document.getElementById('taskNote').value,msg=document.getElementById('taskMsg');if(!type||!pid){msg.innerHTML='<div class="msg err">Select task type and volunteer.</div>';return}const p=state.people[pid],id=uid();await db.set(`sag_tasks/${id}`,{id,date:localDate(),type,personId:pid,personName:p?.name||'',note,done:false,createdAt:new Date().toISOString()});msg.innerHTML='<div class="msg ok">Task assigned!</div>'}
async function toggleTask(key){const t=state.tasks.find(x=>x._key===key);if(!t)return;await db.patch(`sag_tasks/${key}`,{done:!t.done,doneAt:!t.done?new Date().toISOString():null})}
async function deleteTask(key){if(confirm('Delete this task?'))await db.remove(`sag_tasks/${key}`)}
async function savePhoto(){const url=document.getElementById('photoUrl').value.trim(),id=state.photoCat;if(url)await db.set(`sag_cat_photos/${id}`,url);else await db.remove(`sag_cat_photos/${id}`);state.photoCat=null;document.getElementById('photoModal')?.remove();render()}
async function savePerson(){const isNew=state.editingPerson==='new',uidv=isNew?document.getElementById('personUid').value.trim():state.editingPerson,name=document.getElementById('personName').value.trim(),email=document.getElementById('personEmail').value.trim(),role=document.getElementById('personRole').value,msg=document.getElementById('personMsg');if(!uidv||!name||!email){msg.innerHTML='<div class="msg err">Name, email and UID are required.</div>';return}if(isNew&&state.people[uidv]){msg.innerHTML='<div class="msg err">That UID already exists.</div>';return}const existing=state.people[uidv]||{};await db.set(`sag_people/${uidv}`,{...existing,uid:uidv,name,email,role,active:existing.active!==false,protected:!!existing.protected});state.editingPerson=null;document.getElementById('personModal')?.remove();render()}
async function archivePerson(id){const p=state.people[id];if(!p||p.protected)return;await db.patch(`sag_people/${id}`,{active:p.active===false})}
async function deletePerson(id){const p=state.people[id];if(!p||p.protected)return;if(confirm(`Remove ${p.name}?`))await db.remove(`sag_people/${id}`)}
async function changePassword(){const a=document.getElementById('newPw').value,b=document.getElementById('confirmPw').value,msg=document.getElementById('settingsMsg');if(a.length<6){msg.innerHTML='<div class="msg err">Minimum 6 characters.</div>';return}if(a!==b){msg.innerHTML='<div class="msg err">Passwords do not match.</div>';return}try{await state.user.updatePassword(a);msg.innerHTML='<div class="msg ok">Password updated!</div>'}catch(e){if(e.code==='auth/requires-recent-login'){await AUTH.sendPasswordResetEmail(state.user.email);msg.innerHTML='<div class="msg ok">Reset email sent.</div>'}else msg.innerHTML='<div class="msg err">Could not update password.</div>'}}
function printReport(){const rows=CATS.map(c=>{const r=state.daily[c.id]||{};return `<tr><td>${c.n}</td><td>${esc(c.name)}${r.urgent?' ⚠️':''}</td><td>${r.am?'✓':''}</td><td>${r.pm?'✓':''}</td><td>${r.ate?'✓':''}</td><td>${r.water?'✓':''}</td><td>${r.litter?'✓':''}</td><td>${r.med?'✓':''}</td><td>${esc(r.careNotes||'')}</td><td>${esc(r.medNotes||'')}</td></tr>`}).join('');const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><title>Zaenid Michis Report</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border-bottom:1px solid #ddd;padding:5px;text-align:left}th{background:#0f172a;color:white}</style></head><body><h2>Zaenid Michis — Care Report</h2><p>${fmtD(state.date)}</p><table><thead><tr><th>#</th><th>Name</th><th>AM</th><th>PM</th><th>Food</th><th>Water</th><th>Litter</th><th>Med</th><th>Care Notes</th><th>Medical Notes</th></tr></thead><tbody>${rows}</tbody></table>${state.dailyNotes?`<p><b>General notes:</b> ${esc(state.dailyNotes)}</p>`:''}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
async function login(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,msg=document.getElementById('loginMsg');if(!e||!p){msg.innerHTML='<div class="msg err">Enter email and password.</div>';return}if(!navigator.onLine){msg.innerHTML='<div class="msg err">Internet is required for a new sign-in.</div>';return}try{await AUTH.signInWithEmailAndPassword(e,p)}catch(err){const map={'auth/invalid-credential':'Incorrect email or password.','auth/wrong-password':'Incorrect password.','auth/user-not-found':'No account found.','auth/too-many-requests':'Too many attempts.'};msg.innerHTML=`<div class="msg err">${map[err.code]||'Could not sign in.'}</div>`}}
async function forgot(){const e=document.getElementById('email').value.trim(),msg=document.getElementById('loginMsg');if(!e){msg.innerHTML='<div class="msg err">Enter your email first.</div>';return}if(!navigator.onLine){msg.innerHTML='<div class="msg err">Internet is required to send a reset email.</div>';return}try{await AUTH.sendPasswordResetEmail(e);msg.innerHTML='<div class="msg ok">✅ Reset email sent!</div>'}catch{msg.innerHTML='<div class="msg err">Could not send reset email.</div>'}}
function handleClick(e){const t=e.target.closest('[data-act],[data-tab],[data-filter],[data-cat],[data-care],[data-task-toggle],[data-task-del],[data-photo],[data-photo-remove],[data-person-edit],[data-person-archive],[data-person-del],[data-archive]');if(!t)return;if(t.dataset.tab){state.tab=t.dataset.tab;state.search='';if(state.tab==='care'||state.tab==='history')bindDaily();render();return}if(t.dataset.filter){state.filter=t.dataset.filter;render();return}if(t.dataset.cat){state.selectedCat=t.dataset.cat;openCatModal();return}if(t.dataset.care){markCare(t.dataset.care);return}if(t.dataset.taskToggle){toggleTask(t.dataset.taskToggle);return}if(t.dataset.taskDel){deleteTask(t.dataset.taskDel);return}if(t.dataset.photo){state.photoCat=t.dataset.photo;openPhotoModal();return}if(t.dataset.photoRemove){if(confirm('Remove photo?'))db.remove(`sag_cat_photos/${t.dataset.photoRemove}`);return}if(t.dataset.personEdit){state.editingPerson=t.dataset.personEdit;openPersonModal();return}if(t.dataset.personArchive){archivePerson(t.dataset.personArchive);return}if(t.dataset.personDel){deletePerson(t.dataset.personDel);return}if(t.dataset.archive!==undefined){state.archived=t.dataset.archive==='1';render();return}const a=t.dataset.act;if(a==='logout')AUTH.signOut();else if(a==='login')login();else if(a==='forgot')forgot();else if(a==='settings'){state.settings=true;render()}else if(a==='closeSettings'){state.settings=false;render()}else if(a==='print')printReport();else if(a==='addTask')addTask();else if(a==='newPerson'){state.editingPerson='new';openPersonModal()}else if(a==='closeCat'){state.selectedCat=null;document.getElementById('catModal')?.remove()}else if(a==='saveCatNotes')saveCatNotes();else if(a==='closePhoto'){state.photoCat=null;document.getElementById('photoModal')?.remove()}else if(a==='savePhoto')savePhoto();else if(a==='closePerson'){state.editingPerson=null;document.getElementById('personModal')?.remove()}else if(a==='savePerson')savePerson();else if(a==='changePw')changePassword()}
function bindClicks(){app.onclick=handleClick;const cs=document.getElementById('catSearch');cs?.addEventListener('input',e=>{state.search=e.target.value;render()});const hd=document.getElementById('histDate');hd?.addEventListener('change',e=>{state.date=e.target.value;bindDaily();render()})}
function setupInstall(){const box=document.getElementById('installBox');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(!localStorage.getItem('zm_install_dismissed')){box.classList.remove('hidden');box.innerHTML='<span>Install Zaenid Michis for faster/offline use.</span><button id="doInstall">Install</button><button class="x" id="dismissInstall">×</button>';document.getElementById('doInstall').onclick=async()=>{installPrompt.prompt();await installPrompt.userChoice;box.classList.add('hidden');installPrompt=null};document.getElementById('dismissInstall').onclick=()=>{localStorage.setItem('zm_install_dismissed','1');box.classList.add('hidden')}}});const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(ios&&!standalone&&!localStorage.getItem('zm_ios_tip')){box.classList.remove('hidden');box.innerHTML='<span>On iPhone: Safari → Share → Add to Home Screen.</span><button class="x" id="dismissIos">×</button>';document.getElementById('dismissIos').onclick=()=>{localStorage.setItem('zm_ios_tip','1');box.classList.add('hidden')}}}
window.addEventListener('online',()=>{state.online=true;flushQueue();renderStatus()});window.addEventListener('offline',()=>{state.online=false;renderStatus()});
AUTH.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
AUTH.onAuthStateChanged(async user=>{cleanup(state.unsubs);cleanup(state.viewUnsubs);state.user=user;if(!user){state.authState='out';state.person=null;render();return}state.authState='in';const raw=await db.get('sag_people');state.people=mergePeople(raw);const p=state.people[user.uid];if(!p)state.person={notReg:true,email:user.email};else if(p.active===false)state.person={deact:true,email:user.email};else state.person={...p,uid:user.uid,email:p.email||user.email};bindCore();bindDaily();render();if(navigator.onLine)flushQueue()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
setupInstall();render();
})();
</script>
</body>
</html>

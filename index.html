<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- PWA / home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zaenid Michis" />
  
  
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <title>Zaenid Michis</title>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overscroll-behavior: none; background: #f8fafc; }
    /* Prevent iOS double-tap zoom on inputs */
    input, select, textarea { font-size: 16px !important; }
  </style>

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ──────────────────────────────────────────────────────────────
    // FIREBASE INIT
    // ──────────────────────────────────────────────────────────────
    if (!firebase.apps.length) {
      firebase.initializeApp({
        apiKey: "AIzaSyCiAQmrzirdICxSxxKjf9xaL7lBhU9hdnk",
        authDomain: "zaenid-michis.firebaseapp.com",
        databaseURL: "https://zaenid-michis-default-rtdb.firebaseio.com",
        projectId: "zaenid-michis",
        storageBucket: "zaenid-michis.firebasestorage.app",
        messagingSenderId: "754852396413",
        appId: "1:754852396413:web:f64fa553126cc01e102014"
      });
    }
    const firebaseDB = firebase.database();

    // ──────────────────────────────────────────────────────────────
    // CONSTANTS
    // ──────────────────────────────────────────────────────────────
    const DEFAULT_COORD_PIN = "8391";

    const CAT_ROUTINE_TASKS = [
      "Clean cage",
      "Change cat litter",
      "Wash & refill wet food bowl",
      "Wash & refill dry food bowl",
      "Wash & refill water bowl",
    ];

    const SPECIAL_TASK_TEMPLATES = [
      "Vet appointment",
      "Move cat to another location",
      "Trap feral cat",
      "Transfer to foster home",
      "Clean transport kennel",
      "Clean trap cage",
      "Laundry – towels & cat bed",
    ];

    // ──────────────────────────────────────────────────────────────
    // HELPERS
    // ──────────────────────────────────────────────────────────────
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const uid      = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const fmtDate  = (d) =>
      new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    const fmtTime  = (iso) =>
      new Date(iso).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });

    // ──────────────────────────────────────────────────────────────
    // STORAGE  →  Firebase Realtime Database (shared across devices)
    // ──────────────────────────────────────────────────────────────
    const db = {
      async get(key) {
        try {
          const snap = await firebaseDB.ref(key).get();
          return snap.exists() ? snap.val() : null;
        } catch { return null; }
      },
      async set(key, val) {
        try { await firebaseDB.ref(key).set(val); } catch(e) { console.error(e); }
      },
    };

    // ──────────────────────────────────────────────────────────────
    // MAIN APP
    // ──────────────────────────────────────────────────────────────
    function App() {
      const [screen, setScreen] = useState("loading");
      const [user,   setUser  ] = useState(null);
      const [data,   setData  ] = useState({
        coordPin: DEFAULT_COORD_PIN,
        locations: [], cats: [], volunteers: [], assignments: [],
      });

      useEffect(() => {
        (async () => {
          const d = {
            coordPin:    (await db.get("sag_coordPin"))    ?? DEFAULT_COORD_PIN,
            locations:   (await db.get("sag_locations"))   ?? [],
            cats:        (await db.get("sag_cats"))        ?? [],
            volunteers:  (await db.get("sag_volunteers"))  ?? [],
            assignments: (await db.get("sag_assignments")) ?? [],
          };
          setData(d);
          setScreen("login");
        })();
      }, []);

      const save = async (key, value) => {
        const keyMap = {
          coordPin: "sag_coordPin", locations: "sag_locations",
          cats: "sag_cats", volunteers: "sag_volunteers", assignments: "sag_assignments",
        };
        setData(prev => ({ ...prev, [key]: value }));
        await db.set(keyMap[key], value);
      };

      const login = (pin) => {
        if (pin === data.coordPin) {
          setUser({ role: "coordinator" }); setScreen("coordinator"); return true;
        }
        const vol = data.volunteers.find(v => v.pin === pin && v.active !== false);
        if (vol) { setUser({ role: "volunteer", ...vol }); setScreen("volunteer"); return true; }
        return false;
      };

      const logout = () => { setUser(null); setScreen("login"); };

      if (screen === "loading")     return <LoadingScreen />;
      if (screen === "login")       return <LoginScreen onLogin={login} />;
      if (screen === "coordinator") return <CoordApp data={data} save={save} onLogout={logout} />;
      if (screen === "volunteer")   return <VolunteerApp user={user} data={data} save={save} onLogout={logout} />;
      return null;
    }

    // ──────────────────────────────────────────────────────────────
    // LOADING
    // ──────────────────────────────────────────────────────────────
    function LoadingScreen() {
      return (
        <div className="min-h-screen bg-slate-900 flex items-center justify-center">
          <div className="text-center">
            <div className="text-6xl mb-4">🐾</div>
            <div className="text-white font-bold text-xl">Zaenid Michis</div>
            <div className="text-slate-400 text-sm mt-1">Loading…</div>
          </div>
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────
    // LOGIN
    // ──────────────────────────────────────────────────────────────
    function LoginScreen({ onLogin }) {
      const [pin,   setPin  ] = useState("");
      const [error, setError] = useState(false);

      const submit = () => {
        if (!onLogin(pin)) {
          setError(true);
          setTimeout(() => setError(false), 2000);
          setPin("");
        }
      };

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-6">
          <div className="w-full max-w-sm">
            <div className="text-center mb-8">
              <div className="text-7xl mb-4">🐾</div>
              <h1 className="text-3xl font-bold text-white tracking-tight">Zaenid Michis</h1>
              <p className="text-slate-400 mt-2 text-sm">Volunteer Task Manager</p>
            </div>
            <div className="bg-white rounded-2xl p-6 shadow-2xl">
              <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Enter PIN</label>
              <input
                type="password"
                inputMode="numeric"
                value={pin}
                onChange={e => { setPin(e.target.value); setError(false); }}
                onKeyDown={e => e.key === "Enter" && submit()}
                placeholder="••••"
                className={`w-full border-2 rounded-xl px-4 py-4 text-2xl text-center tracking-widest font-mono focus:outline-none transition-colors ${
                  error ? "border-red-400 bg-red-50" : "border-slate-200 focus:border-teal-500"
                }`}
                autoFocus
              />
              {error && <p className="text-red-500 text-sm text-center mt-2 font-medium">Invalid PIN — please try again</p>}
              <button onClick={submit}
                className="mt-4 w-full bg-slate-900 text-white font-semibold py-3.5 rounded-xl text-sm tracking-wide">
                Sign In
              </button>
            </div>
            <p className="text-slate-600 text-xs text-center mt-4">
              Default coordinator PIN: <span className="font-mono text-slate-400">1234</span>
            </p>
          </div>
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────
    // COORDINATOR APP
    // ──────────────────────────────────────────────────────────────
    function CoordApp({ data, save, onLogout }) {
      const [tab, setTab] = useState("today");

      const TABS = [
        { id: "today",      icon: "📋", label: "Today"    },
        { id: "assign",     icon: "✏️", label: "Assign"   },
        { id: "cats",       icon: "🐱", label: "Cats"     },
        { id: "locations",  icon: "🏠", label: "Places"   },
        { id: "volunteers", icon: "👤", label: "People"   },
        { id: "history",    icon: "📅", label: "History"  },
        { id: "settings",   icon: "⚙️", label: "Settings" },
      ];

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <header className="bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-10">
            <div className="flex items-center gap-2">
              <span className="text-xl">🐾</span>
              <div>
                <div className="font-bold text-sm leading-tight">Zaenid Michis</div>
                <div className="text-slate-400 text-xs">Coordinator</div>
              </div>
            </div>
            <button onClick={onLogout} className="text-slate-400 text-xs border border-slate-600 px-3 py-1.5 rounded-lg">
              Sign out
            </button>
          </header>

          <main className="flex-1 overflow-auto pb-20">
            {tab === "today"      && <TodayTab      data={data} save={save} />}
            {tab === "assign"     && <AssignTab     data={data} save={save} />}
            {tab === "cats"       && <CatsTab       data={data} save={save} />}
            {tab === "locations"  && <LocationsTab  data={data} save={save} />}
            {tab === "volunteers" && <VolunteersTab  data={data} save={save} />}
            {tab === "history"    && <HistoryTab    data={data} />}
            {tab === "settings"   && <SettingsTab   data={data} save={save} />}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex z-10">
            {TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`flex-1 py-2 flex flex-col items-center gap-0.5 transition-colors min-w-0 ${
                  tab === t.id ? "text-teal-600" : "text-slate-400"
                }`}>
                <span className="text-base leading-none">{t.icon}</span>
                <span className="text-[10px] font-medium leading-none">{t.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────
    // TODAY TAB
    // ──────────────────────────────────────────────────────────────
    function TodayTab({ data, save }) {
      const tday = todayISO();
      const todayAsgns = data.assignments
        .filter(a => a.date === tday)
        .sort((a, b) => a.shift.localeCompare(b.shift));

      const getVol = id => data.volunteers.find(v => v.id === id);

      const deleteAssignment = async (id) => {
        if (!window.confirm("Delete this assignment? This cannot be undone.")) return;
        await save("assignments", data.assignments.filter(a => a.id !== id));
      };

      return (
        <div className="p-4 space-y-4">
          <div className="flex items-baseline justify-between">
            <h2 className="text-base font-bold text-slate-800">{fmtDate(tday)}</h2>
            <span className="text-xs text-slate-400">{todayAsgns.length} assignment{todayAsgns.length !== 1 ? "s" : ""}</span>
          </div>

          {todayAsgns.length === 0
            ? <Empty icon="📋" title="No assignments today" subtitle="Go to Assign to create some." />
            : todayAsgns.map(a => {
              const vol  = getVol(a.volunteerId);
              const done = a.tasks.filter(t => t.completedAt).length;
              const pct  = a.tasks.length ? Math.round(done / a.tasks.length * 100) : 0;
              const isAM = a.shift === "AM";
              return (
                <div key={a.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                  <div className={`px-4 py-3 flex items-center justify-between ${isAM ? "bg-amber-50 border-b border-amber-100" : "bg-indigo-50 border-b border-indigo-100"}`}>
                    <div className="flex items-center gap-2">
                      <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${isAM ? "bg-amber-500 text-white" : "bg-indigo-600 text-white"}`}>
                        {isAM ? "☀️ AM" : "🌙 PM"}
                      </span>
                      <span className="font-semibold text-slate-800 text-sm">{vol?.name ?? "Unknown"}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className={`text-sm font-bold ${pct === 100 ? "text-emerald-600" : "text-slate-500"}`}>{done}/{a.tasks.length}</span>
                      <button onClick={() => deleteAssignment(a.id)} className="text-slate-300 font-bold text-lg leading-none">✕</button>
                    </div>
                  </div>
                  <div className="h-1.5 bg-slate-100">
                    <div className={`h-full transition-all duration-500 ${pct === 100 ? "bg-emerald-500" : isAM ? "bg-amber-400" : "bg-indigo-500"}`} style={{ width: `${pct}%` }} />
                  </div>
                  <div className="px-4 py-3 space-y-1.5">
                    {a.tasks.map(t => (
                      <div key={t.id} className="flex items-center gap-2 text-sm">
                        <span className={t.completedAt ? "text-emerald-500" : "text-slate-300"}>{t.completedAt ? "✓" : "○"}</span>
                        <span className={`flex-1 ${t.completedAt ? "line-through text-slate-400" : "text-slate-700"}`}>
                          {t.catName && <span className="font-semibold text-slate-500">[{t.catName}]</span>}{t.catName ? " " : ""}{t.name}
                        </span>
                        {t.completedAt && <span className="text-slate-300 text-xs flex-shrink-0">{fmtTime(t.completedAt)}</span>}
                      </div>
                    ))}
                  </div>
                  {pct === 100 && (
                    <div className="px-4 pb-3">
                      <div className="bg-emerald-50 text-emerald-700 text-xs font-semibold text-center py-2 rounded-xl border border-emerald-100">
                        🎉 All tasks complete!
                      </div>
                    </div>
                  )}
                </div>
              );
            })
          }
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────
    // ASSIGN TAB
    // ──────────────────────────────────────────────────────────────
    function AssignTab({ data, save }) {
      const [date,       setDate      ] = useState(todayISO());
      const [shift,      setShift     ] = useState("AM");
      const [volId,      setVolId     ] = useState("");
      const [selCats,    setSelCats   ] = useState([]);
      const [selLocs,    setSelLocs   ] = useState([]);
      const [specials,   setSpecials  ] = useState([]);
      const [newSpecial, setNewSpecial] = useState("");
      const [flash,      setFlash     ] = useState(null);

      const toggleCat = id => setSelCats(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
      const toggleLoc = id => setSelLocs(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);

      const addSpecial = () => {
        const t = newSpecial.trim();
        if (t && !specials.includes(t)) { setSpecials(p => [...p, t]); setNewSpecial(""); }
      };

      const buildTasks = () => {
        const tasks = [];
        selCats.forEach(catId => {
          const cat = data.cats.find(c => c.id === catId);
          if (!cat) return;
          const locName = data.locations.find(l => l.id === cat.locationId)?.name ?? "";
          CAT_ROUTINE_TASKS.forEach(name =>
            tasks.push({ id: uid(), type: "routine", catId, catName: cat.name, locationName: locName, name, completedAt: null })
          );
          (cat.medications || []).forEach(med => {
            if (med.schedule === "Both" || med.schedule === shift) {
              tasks.push({
                id: uid(), type: "medication", catId, catName: cat.name, locationName: locName,
                name: `Give ${med.name}${med.dosage ? " " + med.dosage : ""}${med.notes ? " — " + med.notes : ""}`,
                completedAt: null,
              });
            }
          });
        });
        selLocs.forEach(locId => {
          const loc = data.locations.find(l => l.id === locId);
          if (!loc) return;
          tasks.push({ id: uid(), type: "location", locationId: locId, locationName: loc.name, name: `Clean ${loc.name}`, completedAt: null });
        });
        specials.forEach(name => tasks.push({ id: uid(), type: "special", name, completedAt: null }));
        return tasks;
      };

      const handleSave = async () => {
        if (!volId) { setFlash({ ok: false, msg: "Please select a volunteer." }); return; }
        const tasks = buildTasks();
        if (!tasks.length) { setFlash({ ok: false, msg: "Add at least one cat, location, or special task." }); return; }
        const vol = data.volunteers.find(v => v.id === volId);
        const asgn = { id: uid(), date, shift, volunteerId: volId, volunteerName: vol?.name ?? "", tasks, createdAt: new Date().toISOString() };
        await save("assignments", [...data.assignments, asgn]);
        setSelCats([]); setSelLocs([]); setSpecials([]); setVolId("");
        setFlash({ ok: true, msg: "Assignment saved!" });
        setTimeout(() => setFlash(null), 3000);
      };

      const activeCats = data.cats.filter(c => c.active !== false);
      const activeVols = data.volunteers.filter(v => v.active !== false);

      return (
        <div className="p-4 space-y-4">
          <h2 className="text-base font-bold text-slate-800">Create Assignment</h2>

          {flash && (
            <div className={`text-sm px-4 py-3 rounded-xl font-medium ${flash.ok ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-600"}`}>
              {flash.msg}
            </div>
          )}

          <Card title="Assignment Details">
            <div className="space-y-3">
              <div>
                <Label>Date</Label>
                <input type="date" value={date} onChange={e => setDate(e.target.value)} className={inputCls} />
              </div>
              <div>
                <Label>Shift</Label>
                <div className="grid grid-cols-2 gap-2">
                  {["AM", "PM"].map(s => (
                    <button key={s} onClick={() => setShift(s)}
                      className={`py-2.5 rounded-xl text-sm font-semibold border-2 transition-all ${
                        shift === s
                          ? s === "AM" ? "bg-amber-500 border-amber-500 text-white" : "bg-indigo-600 border-indigo-600 text-white"
                          : "border-slate-200 text-slate-500"
                      }`}>
                      {s === "AM" ? "☀️ Morning" : "🌙 Afternoon"}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <Label>Volunteer</Label>
                <select value={volId} onChange={e => setVolId(e.target.value)} className={inputCls}>
                  <option value="">— Select volunteer —</option>
                  {activeVols.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                </select>
              </div>
            </div>
          </Card>

          <Card title="🐱 Cats to care for">
            {activeCats.length === 0
              ? <p className="text-slate-400 text-sm">No cats set up yet. Go to the Cats tab first.</p>
              : <div className="space-y-2">
                {activeCats.map(cat => {
                  const loc = data.locations.find(l => l.id === cat.locationId);
                  const sel = selCats.includes(cat.id);
                  return (
                    <div key={cat.id} onClick={() => toggleCat(cat.id)}
                      className={`flex items-center gap-3 p-3 rounded-xl border-2 cursor-pointer transition-all ${sel ? "border-teal-400 bg-teal-50" : "border-slate-100"}`}>
                      <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${sel ? "bg-teal-500 border-teal-500" : "border-slate-300"}`}>
                        {sel && <span className="text-white text-xs font-bold">✓</span>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="font-medium text-sm text-slate-800">{cat.name}</div>
                        <div className="text-xs text-slate-400">{loc?.name ?? "No location"}{cat.cageNumber ? ` · ${cat.cageNumber}` : ""}</div>
                      </div>
                      {(cat.medications || []).length > 0 && (
                        <span className="text-xs bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full font-medium flex-shrink-0">💊</span>
                      )}
                    </div>
                  );
                })}
              </div>
            }
          </Card>

          <Card title="🏠 Apartments / Catios to clean">
            {data.locations.length === 0
              ? <p className="text-slate-400 text-sm">No locations added yet. Go to Places first.</p>
              : <div className="space-y-2">
                {data.locations.map(loc => {
                  const sel = selLocs.includes(loc.id);
                  return (
                    <div key={loc.id} onClick={() => toggleLoc(loc.id)}
                      className={`flex items-center gap-3 p-3 rounded-xl border-2 cursor-pointer transition-all ${sel ? "border-teal-400 bg-teal-50" : "border-slate-100"}`}>
                      <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${sel ? "bg-teal-500 border-teal-500" : "border-slate-300"}`}>
                        {sel && <span className="text-white text-xs font-bold">✓</span>}
                      </div>
                      <span className="text-sm font-medium text-slate-800">{loc.name}</span>
                      <span className="text-xs text-slate-400 capitalize ml-auto">{loc.type}</span>
                    </div>
                  );
                })}
              </div>
            }
          </Card>

          <Card title="⭐ Special Tasks">
            <div className="flex flex-wrap gap-1.5 mb-3">
              {SPECIAL_TASK_TEMPLATES.map(t => (
                <button key={t} onClick={() => { if (!specials.includes(t)) setSpecials(p => [...p, t]); }}
                  className={`text-xs px-3 py-1.5 rounded-full border transition-all ${
                    specials.includes(t) ? "bg-orange-100 border-orange-300 text-orange-700" : "border-slate-200 text-slate-500"
                  }`}>{t}
                </button>
              ))}
            </div>
            <div className="flex gap-2 mb-2">
              <input value={newSpecial} onChange={e => setNewSpecial(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addSpecial()}
                placeholder="Add custom task…" className={`flex-1 ${inputCls}`} />
              <button onClick={addSpecial} className="bg-slate-100 text-slate-700 px-4 rounded-xl text-sm font-medium">Add</button>
            </div>
            {specials.map((t, i) => (
              <div key={i} className="flex items-center justify-between bg-orange-50 border border-orange-100 rounded-xl px-3 py-2 mb-2">
                <span className="text-sm text-orange-800">⭐ {t}</span>
                <button onClick={() => setSpecials(p => p.filter((_, idx) => idx !== i))} className="text-slate-400 ml-2 text-lg leading-none font-bold">×</button>
              </div>
            ))}
          </Card>

          <button onClick={handleSave}

    function CatsTab({ data, save }) {
      const [mode,    setMode   ] = useState("list");

      const [form,    setForm   ] = useState({});

      const openNew  = () => { setForm({ name: "", locationId: "", cageNumber: "", status: "resident", medications: [], notes: "", active: true }); setEditing("new"); setMode("form"); };
      const openEdit = (cat) => { setForm({ ...cat, medications: cat.medications ? [...cat.medications] : [] }); setEditing(cat); setMode("form"); };

      const setF     = (k, v) => setForm(p => ({ ...p, [k]: v }));

      const addMed    = () => setF("medications", [...(form.medications || []), { id: uid(), name: "", dosage: "", schedule: "AM", notes: "" }]);
      const updMed    = (i, k, v) => { const m = [...(form.medications || [])]; m[i] = { ...m[i], [k]: v }; setF("medications", m); };
      const removeMed = (i) => setF("medications", (form.medications || []).filter((_, idx) => idx !== i));

      const archivedCats = data.cats.filter(c => c.active === false);

                <div>

                    <option value="feral">Feral / Undomesticated</option>
                    <option value="foster">Foster</option>
                  </select>
                </div>
                <Field label="Notes" value={form.notes || ""} onChange={v => setF("notes", v)} placeholder="e.g. Shy, needs extra time" multiline />

            </Card>

            <Card title="💊 Medications">
              {(form.medications || []).length === 0
                ? <p className="text-slate-400 text-sm mb-3">No medications added.</p>

                  {(form.medications || []).map((med, i) => (

                      <Field label="Medication name" value={med.name} onChange={v => updMed(i, "name", v)} placeholder="e.g. Amoxicillin" />

                      <div>
                        <Label>Schedule</Label>
                        <select value={med.schedule} onChange={e => updMed(i, "schedule", e.target.value)} className={inputCls}>
                          <option value="AM">Morning (AM) only</option>

                          <option value="Both">AM & PM — twice daily</option>
                        </select>
                      </div>
                      <Field label="Notes" value={med.notes} onChange={v => updMed(i, "notes", v)} placeholder="e.g. Give with food" />

      return (

          <div className="flex items-center justify-between">

          </div>
          {activeCats.length === 0
            ? <Empty icon="🐱" title="No cats added yet" subtitle="Tap Add Cat to get started." />
            : activeCats.map(cat => (
              <div key={cat.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
                <div className="flex items-start justify-between">
                  <div className="flex-1 min-w-0">
                    <div className="font-semibold text-slate-800">{cat.name}</div>
                    <div className="text-sm text-slate-400 mt-0.5">{getLocName(cat.locationId)}{cat.cageNumber ? ` · Cage ${cat.cageNumber}` : ""}</div>
                    <div className="flex flex-wrap gap-1.5 mt-2">
                      <span className={`text-xs px-2.5 py-0.5 rounded-full font-medium capitalize ${statusColor[cat.status] ?? "bg-slate-100 text-slate-600"}`}>{cat.status}</span>
                      {(cat.medications || []).length > 0 && (
                        <span className="text-xs bg-rose-50 text-rose-600 border border-rose-100 px-2.5 py-0.5 rounded-full font-medium">

                  <div className="flex flex-col items-end gap-1.5 ml-3 flex-shrink-0">

    // ──────────────────────────────────────────────────────────────
    // VOLUNTEERS TAB
    // ──────────────────────────────────────────────────────────────
    function VolunteersTab({ data, save }) {
      const [mode,     setMode    ] = useState("list");
      const [editing,  setEditing ] = useState(null);
      const [form,     setForm    ] = useState({});
      const [showPins, setShowPins] = useState({});
      const [err,      setErr     ] = useState("");

      const openNew  = () => { setForm({ name: "", pin: "", active: true }); setEditing("new"); setMode("form"); setErr(""); };
      const openEdit = (v) => { setForm({ ...v }); setEditing(v); setMode("form"); setErr(""); };
      const close    = () => { setMode("list"); setEditing(null); setForm({}); setErr(""); };
      const setF     = (k, v) => setForm(p => ({ ...p, [k]: v }));

      const handleSave = async () => {
        if (!form.name?.trim()) { setErr("Name is required."); return; }
        if (!form.pin?.trim() || form.pin.length < 4) { setErr("PIN must be at least 4 characters."); return; }
        if (form.pin === data.coordPin) { setErr("That PIN is reserved for the coordinator."); return; }
        const conflict = data.volunteers.find(v => v.pin === form.pin && v.id !== form.id);
        if (conflict) { setErr(`PIN is already used by ${conflict.name}.`); return; }
        const vols = editing === "new"
          ? [...data.volunteers, { ...form, id: uid() }]
          : data.volunteers.map(v => v.id === editing.id ? { ...form, id: v.id } : v);
        await save("volunteers", vols);
        close();
      };

      const toggleActive = async (vol) => {
        await save("volunteers", data.volunteers.map(v => v.id === vol.id ? { ...v, active: !v.active } : v));
      };

      const activeVols   = data.volunteers.filter(v => v.active !== false);
      const inactiveVols = data.volunteers.filter(v => v.active === false);

      if (mode === "form") {
        return (
          <div className="p-4 space-y-4">
            <BackBar onBack={close} title={editing === "new" ? "Add Volunteer" : "Edit Volunteer"} />
            <Card>
              <div className="space-y-3">
                <Field label="Full Name *" value={form.name || ""} onChange={v => setF("name", v)} placeholder="e.g. Maria González" />
                <Field label="PIN * (min. 4 characters)" value={form.pin || ""} onChange={v => setF("pin", v)} placeholder="e.g. 5678" type="password" />
                <p className="text-xs text-slate-400">Each volunteer has a unique PIN. They enter it to see only their own tasks.</p>
                {err && <div className="text-sm text-red-600 bg-red-50 px-3 py-2 rounded-xl">{err}</div>}
              </div>
            </Card>
            <button onClick={handleSave} className="w-full bg-slate-900 text-white font-semibold py-4 rounded-2xl text-sm">Save Volunteer</button>
          </div>
        );
      }

      return (
        <div className="p-4 space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="text-base font-bold text-slate-800">Volunteers ({activeVols.length})</h2>
            <button onClick={openNew} className="bg-slate-900 text-white text-xs px-4 py-2 rounded-xl font-medium">+ Add</button>
          </div>
          {activeVols.length === 0
            ? <Empty icon="👤" title="No volunteers yet" subtitle="Add volunteers and set their individual PINs." />
            : activeVols.map(vol => (
              <div key={vol.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
                <div className="flex items-center justify-between">
                  <div>
                    <div className="font-semibold text-slate-800">{vol.name}</div>
                    <div className="text-sm text-slate-400 mt-0.5 font-mono">
                      PIN: {showPins[vol.id] ? vol.pin : "••••"}
                      <button onClick={() => setShowPins(p => ({ ...p, [vol.id]: !p[vol.id] }))}
                        className="ml-2 text-xs text-teal-500 font-sans font-medium">
                        {showPins[vol.id] ? "hide" : "reveal"}
                      </button>
                    </div>
                  </div>
                  <div className="flex flex-col items-end gap-1.5 ml-3">
                    <button onClick={() => openEdit(vol)} className="text-xs text-teal-600 font-medium">Edit</button>
                    <button onClick={() => toggleActive(vol)} className="text-xs text-slate-400">Deactivate</button>
                  </div>
                </div>
              </div>
            ))
          }
          {inactiveVols.length > 0 && (
            <p className="text-center text-xs text-slate-400 mt-1">
              {inactiveVols.length} inactive volunteer{inactiveVols.length > 1 ? "s" : ""} not shown.
            </p>
          )}
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────
    // HISTORY TAB
    // ──────────────────────────────────────────────────────────────
    function HistoryTab({ data }) {
      const [date, setDate] = useState(todayISO());
      const asgns = data.assignments
        .filter(a => a.date === date)
        .sort((a, b) => a.shift.localeCompare(b.shift));
      const getVol = id => data.volunteers.find(v => v.id === id)?.name ?? "Unknown";

              className="border border-slate-200 rounded-xl px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white" />
          </div>
          {asgns.length === 0
            ? <Empty icon="📅" title="No assignments found" subtitle={`Nothing recorded for ${fmtDate(date)}.`} />
            : asgns.map(a => {
              const done = a.tasks.filter(t => t.completedAt).length;
              const pct  = a.tasks.length ? Math.round(done / a.tasks.length * 100) : 0;
              const isAM = a.shift === "AM";
              return (
                <div key={a.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                  <div className={`px-4 py-3 flex items-center justify-between ${isAM ? "bg-amber-50 border-b border-amber-100" : "bg-indigo-50 border-b border-indigo-100"}`}>
                    <div className="flex items-center gap-2">
                      <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${isAM ? "bg-amber-500 text-white" : "bg-indigo-600 text-white"}`}>{a.shift}</span>
                      <span className="font-semibold text-slate-800 text-sm">{getVol(a.volunteerId)}</span>
                    </div>
                    <span className={`text-sm font-bold ${pct === 100 ? "text-emerald-600" : "text-slate-500"}`}>{done}/{a.tasks.length} done</span>
                  </div>
                  <div className="h-1 bg-slate-100">
                    <div className={`h-full ${pct === 100 ? "bg-emerald-500" : isAM ? "bg-amber-400" : "bg-indigo-500"}`} style={{ width: `${pct}%` }} />
                  </div>
                  <div className="px-4 py-3 space-y-1.5">
                    {a.tasks.map(t => (
                      <div key={t.id} className="flex items-center gap-2 text-sm">
                        <span className={t.completedAt ? "text-emerald-500" : "text-slate-300"}>{t.completedAt ? "✓" : "○"}</span>
                        <span className={`flex-1 ${t.completedAt ? "line-through text-slate-400" : "text-slate-700"}`}>
                          {t.catName && <span className="font-semibold text-slate-500">[{t.catName}] </span>}{t.name}

                        {t.completedAt && <span className="text-slate-300 text-xs flex-shrink-0">{fmtTime(t.completedAt)}</span>}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })
          }
        </div>
      );

    // ──────────────────────────────────────────────────────────────
    // SETTINGS TAB
    // ──────────────────────────────────────────────────────────────
    function SettingsTab({ data, save }) {
      const [newPin,  setNewPin ] = useState("");
      const [confirm, setConfirm] = useState("");
      const [msg,     setMsg    ] = useState(null);

      const handleChange = async () => {
        if (newPin.length < 4) { setMsg({ ok: false, text: "PIN must be at least 4 characters." }); return; }
        if (newPin !== confirm) { setMsg({ ok: false, text: "PINs do not match." }); return; }
        const conflict = data.volunteers.find(v => v.pin === newPin);
        if (conflict) { setMsg({ ok: false, text: `That PIN is already used by ${conflict.name}.` }); return; }
        await save("coordPin", newPin);
        setNewPin(""); setConfirm("");
        setMsg({ ok: true, text: "Coordinator PIN updated successfully!" });
        setTimeout(() => setMsg(null), 3000);
      };

      return (
        <div className="p-4 space-y-4">
          <h2 className="text-base font-bold text-slate-800">Settings</h2>
          <Card title="🔐 Change Coordinator PIN">
            <div className="space-y-3">
              <Field label="New PIN" value={newPin} onChange={setNewPin} type="password" placeholder="At least 4 characters" />
              <Field label="Confirm new PIN" value={confirm} onChange={setConfirm} type="password" placeholder="Repeat to confirm" />
              {msg && (
                <div className={`text-sm px-3 py-2 rounded-xl ${msg.ok ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-600"}`}>{msg.text}</div>
              )}
              <button onClick={handleChange} className="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-sm">Update PIN</button>
            </div>
          </Card>
          <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4 text-sm text-amber-800 leading-relaxed">
            <strong>💡 How to share access:</strong> Share this app's URL with your volunteers and give each one their PIN privately. They will only see their own tasks. Keep the coordinator PIN secret.
          </div>
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────
    // VOLUNTEER APP
    // ──────────────────────────────────────────────────────────────
    function VolunteerApp({ user, data, save, onLogout }) {
      const tday = todayISO();
      const myAsgns = data.assignments
        .filter(a => a.date === tday && a.volunteerId === user.id)
        .sort((a, b) => a.shift.localeCompare(b.shift));

      const markTask = async (aId, tId) => {
        const now = new Date().toISOString();
        const updated = data.assignments.map(a => {
          if (a.id !== aId) return a;
          return { ...a, tasks: a.tasks.map(t => t.id !== tId ? t : { ...t, completedAt: t.completedAt ? null : now }) };
        });
        await save("assignments", updated);
      };

      const groupByCat = (tasks) => {
        const catMap = {};
        const other  = [];
        tasks.forEach(t => {
          if (t.catId) {
            if (!catMap[t.catId]) catMap[t.catId] = { catName: t.catName, locName: t.locationName, tasks: [] };
            catMap[t.catId].tasks.push(t);
          } else {
            other.push(t);
          }
        });
        return { catGroups: Object.values(catMap), other };
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <header className="bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-10">
            <div className="flex items-center gap-2">
              <span className="text-xl">🐾</span>
              <div>
                <div className="font-bold text-sm leading-tight">Zaenid Michis</div>
                <div className="text-slate-400 text-xs">Hi, {user.name}!</div>
              </div>
            </div>
            <button onClick={onLogout} className="text-slate-400 text-xs border border-slate-600 px-3 py-1.5 rounded-lg">
              Sign out
            </button>
          </header>

          <main className="flex-1 p-4 space-y-4">
            <h2 className="text-base font-bold text-slate-800">{fmtDate(tday)}</h2>

            {myAsgns.length === 0 ? (
              <div className="text-center py-16">
                <div className="text-6xl mb-4">😺</div>
                <p className="font-semibold text-slate-700">No tasks assigned for today.</p>
                <p className="text-sm text-slate-400 mt-1">Check back later or contact the coordinator.</p>
              </div>
            ) : (
              myAsgns.map(a => {
                const { catGroups, other } = groupByCat(a.tasks);
                const done  = a.tasks.filter(t => t.completedAt).length;
                const total = a.tasks.length;
                const pct   = total ? Math.round(done / total * 100) : 0;
                const isAM  = a.shift === "AM";

                return (
                  <div key={a.id} className={`rounded-2xl border-2 overflow-hidden ${isAM ? "border-amber-200" : "border-indigo-200"}`}>
                    <div className={`px-4 py-3 ${isAM ? "bg-amber-500" : "bg-indigo-600"}`}>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-white font-bold">{isAM ? "☀️ Morning Shift" : "🌙 Afternoon Shift"}</span>
                        <span className="text-white text-sm font-semibold opacity-90">{done}/{total}</span>
                      </div>
                      <div className="bg-black bg-opacity-20 rounded-full h-2">
                        <div className="h-2 bg-white rounded-full transition-all duration-500" style={{ width: `${pct}%` }} />
                      </div>
                    </div>

                    {pct === 100 && (
                      <div className="bg-emerald-500 text-white text-sm font-semibold text-center py-2">
                        🎉 Shift complete — great work!
                      </div>
                    )}

                    <div className="bg-white">
                      {catGroups.map(group => (
                        <div key={group.catName}>
                          <div className={`px-4 py-2 flex items-center gap-2 border-b border-slate-100 ${isAM ? "bg-amber-50" : "bg-indigo-50"}`}>
                            <span>🐱</span>
                            <span className="font-semibold text-slate-800 text-sm">{group.catName}</span>
                            {group.locName && <span className="text-xs text-slate-400">{group.locName}</span>}
                          </div>
                          <div className="divide-y divide-slate-100">
                            {group.tasks.map(t => <TaskRow key={t.id} task={t} onToggle={() => markTask(a.id, t.id)} />)}
                          </div>
                        </div>
                      ))}

                      {other.length > 0 && (
                        <div>
                          <div className="px-4 py-2 bg-slate-50 border-y border-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            Other Tasks
                          </div>
                          <div className="divide-y divide-slate-100">
                            {other.map(t => <TaskRow key={t.id} task={t} onToggle={() => markTask(a.id, t.id)} />)}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </main>
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────
    // TASK ROW
    // ──────────────────────────────────────────────────────────────
    function TaskRow({ task, onToggle }) {
      const icon = task.type === "medication" ? "💊" : task.type === "location" ? "🏠" : task.type === "special" ? "⭐" : null;
      return (
        <div onClick={onToggle}
          className={`flex items-center gap-3 px-4 py-3.5 cursor-pointer select-none transition-colors ${task.completedAt ? "bg-emerald-50" : "active:bg-slate-50"}`}>
          <div className={`w-7 h-7 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all duration-200 ${
            task.completedAt ? "bg-emerald-500 border-emerald-500" : "border-slate-300"
          }`}>
            {task.completedAt && <span className="text-white text-xs font-bold">✓</span>}
          </div>
          <div className="flex-1 min-w-0">
            <div className={`text-sm leading-snug ${task.completedAt ? "line-through text-slate-400" : "text-slate-800"}`}>
              {icon && <span className="mr-1">{icon}</span>}{task.name}
            </div>
            {task.completedAt && (
              <div className="text-xs text-slate-400 mt-0.5">Done at {fmtTime(task.completedAt)}</div>
            )}
          </div>
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────
    // SHARED PRIMITIVES
    // ──────────────────────────────────────────────────────────────
    const inputCls = "w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white";

    function Label({ children }) {
      return <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">{children}</label>;
    }

    function Field({ label, value, onChange, placeholder = "", type = "text", multiline = false }) {
      return (
        <div>
          <Label>{label}</Label>
          {multiline
            ? <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} rows={3} className={inputCls} />
            : <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} className={inputCls} />
          }
        </div>
      );
    }

    function Card({ title, children }) {
      return (
        <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
          {title && <h3 className="font-semibold text-slate-700 text-sm mb-3">{title}</h3>}
          {children}
        </div>
      );
    }

    function BackBar({ onBack, title }) {
      return (
        <div className="flex items-center gap-3 mb-2">
          <button onClick={onBack} className="text-teal-600 text-sm font-medium">← Back</button>
          <h2 className="text-base font-bold text-slate-800">{title}</h2>
        </div>
      );
    }

    function Empty({ icon, title, subtitle }) {
      return (
        <div className="text-center py-14">
          <div className="text-5xl mb-3">{icon}</div>
          <p className="font-semibold text-slate-700">{title}</p>
          {subtitle && <p className="text-sm text-slate-400 mt-1">{subtitle}</p>}
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────
    // RENDER
    // ──────────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

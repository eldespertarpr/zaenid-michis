<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zaenid Michis" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <title>Zaenid Michis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overscroll-behavior: none; background: #f8fafc; }
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    if (!firebase.apps.length) {
      firebase.initializeApp({
        apiKey: "AIzaSyCiAQmrzirdICxSxxKjf9xaL7lBhU9hdnk",
        authDomain: "zaenid-michis.firebaseapp.com",
        databaseURL: "https://zaenid-michis-default-rtdb.firebaseio.com",
        projectId: "zaenid-michis",
        storageBucket: "zaenid-michis.firebasestorage.app",
        messagingSenderId: "754852396413",
        appId: "1:754852396413:web:f64fa553126cc01e102014"
      });
    }

    const firebaseDB = firebase.database();
    const firebaseAuth = firebase.auth();

    const COORDINATOR_EMAILS = ["explorerfta@gmail.com"];
    const DEFAULT_DATA = { locations: [], cats: [], volunteers: [], assignments: [] };

    const CAT_ROUTINE_TASKS = [
      "Clean cage",
      "Change cat litter",
      "Wash & refill wet food bowl",
      "Wash & refill dry food bowl",
      "Wash & refill water bowl",
    ];

    const SPECIAL_TASK_TEMPLATES = [
      "Vet appointment",
      "Move cat to another location",
      "Trap feral cat",
      "Transfer to foster home",
      "Clean transport kennel",
      "Clean trap cage",
      "Laundry – towels & cat bed",
    ];

    const todayISO = () => new Date().toISOString().slice(0, 10);
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const cleanEmail = (v) => (v || "").trim().toLowerCase();
    const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    const fmtTime = (iso) => new Date(iso).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });

    const db = {
      async get(key) {
        try {
          const snap = await firebaseDB.ref(key).get();
          return snap.exists() ? snap.val() : null;
        } catch (e) {
          console.error("Database read failed", key, e);
          return null;
        }
      },
      async set(key, val) {
        try { await firebaseDB.ref(key).set(val); }
        catch (e) { console.error("Database write failed", key, e); alert("Could not save. Check connection or Firebase permissions."); }
      },
    };

    function App() {
      const [screen, setScreen] = useState("login");
      const [user, setUser] = useState(null);
      const [data, setData] = useState(DEFAULT_DATA);

      const loadData = async () => {
        const d = {
          locations: (await db.get("sag_locations")) ?? [],
          cats: (await db.get("sag_cats")) ?? [],
          volunteers: (await db.get("sag_volunteers")) ?? [],
          assignments: (await db.get("sag_assignments")) ?? [],
        };
        setData(d);
        return d;
      };

      useEffect(() => {
        const unsub = firebaseAuth.onAuthStateChanged(async (authUser) => {
          if (!authUser) {
            setUser(null);
            setScreen("login");
          }
        });
        return () => unsub();
      }, []);

      const save = async (key, value) => {
        const keyMap = {
          locations: "sag_locations",
          cats: "sag_cats",
          volunteers: "sag_volunteers",
          assignments: "sag_assignments",
        };
        setData(prev => ({ ...prev, [key]: value }));
        await db.set(keyMap[key], value);
      };

      const login = async (email, password) => {
        try {
          const emailClean = cleanEmail(email);
          await firebaseAuth.signInWithEmailAndPassword(emailClean, password);
          const fresh = await loadData();

          if (COORDINATOR_EMAILS.includes(emailClean)) {
            setUser({ role: "coordinator", email: emailClean, name: "Coordinator" });
            setScreen("coordinator");
            return true;
          }

          const vol = fresh.volunteers.find(v => cleanEmail(v.email) === emailClean && v.active !== false);
          if (vol) {
            setUser({ role: "volunteer", email: emailClean, ...vol });
            setScreen("volunteer");
            return true;
          }

          await firebaseAuth.signOut();
          return false;
        } catch (e) {
          console.error("Sign in failed", e);
          return false;
        }
      };

      const logout = async () => {
        await firebaseAuth.signOut();
        setUser(null);
        setData(DEFAULT_DATA);
        setScreen("login");
      };

      if (screen === "login") return <LoginScreen onLogin={login} />;
      if (screen === "coordinator") return <CoordApp data={data} save={save} onLogout={logout} user={user} />;
      if (screen === "volunteer") return <VolunteerApp user={user} data={data} save={save} onLogout={logout} />;
      return <LoadingScreen />;
    }

    function LoadingScreen() {
      return <div className="min-h-screen bg-slate-900 flex items-center justify-center text-white"><div className="text-center"><div className="text-6xl mb-4">🐾</div><div className="font-bold text-xl">Zaenid Michis</div><div className="text-slate-400 text-sm mt-1">Loading…</div></div></div>;
    }

    function LoginScreen({ onLogin }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState(false);
      const [busy, setBusy] = useState(false);
      const [showPassword, setShowPassword] = useState(false);

      const submit = async () => {
        if (busy) return;
        setBusy(true);
        const ok = await onLogin(email, password);
        setBusy(false);
        if (!ok) {
          setError(true);
          setPassword("");
          setTimeout(() => setError(false), 3000);
        }
      };

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-6">
          <div className="w-full max-w-sm">
            <div className="text-center mb-8">
              <div className="text-7xl mb-4">🐾</div>
              <h1 className="text-3xl font-bold text-white tracking-tight">Zaenid Michis</h1>
              <p className="text-slate-400 mt-2 text-sm">Volunteer Task Manager</p>
            </div>
            <div className="bg-white rounded-2xl p-6 shadow-2xl">
              <Label>Email</Label>
              <input type="email" value={email} onChange={e => { setEmail(e.target.value); setError(false); }} onKeyDown={e => e.key === "Enter" && submit()} placeholder="name@example.com" className="w-full border-2 rounded-xl px-4 py-3 text-base focus:outline-none transition-colors border-slate-200 focus:border-teal-500 mb-3" autoFocus />
              <Label>Password</Label>
              <input type="password" value={password} onChange={e => { setPassword(e.target.value); setError(false); }} onKeyDown={e => e.key === "Enter" && submit()} placeholder="••••••••" className={`w-full border-2 rounded-xl px-4 py-3 text-base focus:outline-none transition-colors ${error ? "border-red-400 bg-red-50" : "border-slate-200 focus:border-teal-500"}`} />
              {error && <p className="text-red-500 text-sm text-center mt-2 font-medium">Invalid login or user not authorized</p>}
              <button onClick={submit} disabled={busy} className="mt-4 w-full bg-slate-900 text-white font-semibold py-3.5 rounded-xl text-sm tracking-wide disabled:opacity-60">{busy ? "Signing in…" : "Sign In"}</button>
            </div>
          </div>
        </div>
      );
    }

    function CoordApp({ data, save, onLogout, user }) {
      const [tab, setTab] = useState("today");
      const TABS = [
        { id: "today", icon: "📋", label: "Today" },
        { id: "assign", icon: "✏️", label: "Assign" },
        { id: "cats", icon: "🐱", label: "Cats" },
        { id: "locations", icon: "🏠", label: "Places" },
        { id: "volunteers", icon: "👤", label: "People" },
        { id: "history", icon: "📅", label: "History" },
        { id: "settings", icon: "⚙️", label: "Settings" },
      ];
      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <Header title="Zaenid Michis" subtitle="Coordinator" onLogout={onLogout} />
          <main className="flex-1 overflow-auto pb-20">
            {tab === "today" && <TodayTab data={data} save={save} />}
            {tab === "assign" && <AssignTab data={data} save={save} />}
            {tab === "cats" && <CatsTab data={data} save={save} />}
            {tab === "locations" && <LocationsTab data={data} save={save} />}
            {tab === "volunteers" && <VolunteersTab data={data} save={save} />}
            {tab === "history" && <HistoryTab data={data} />}
            {tab === "settings" && <SettingsTab user={user} />}
          </main>
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex z-10">
            {TABS.map(t => <button key={t.id} onClick={() => setTab(t.id)} className={`flex-1 py-2 flex flex-col items-center gap-0.5 min-w-0 ${tab === t.id ? "text-teal-600" : "text-slate-400"}`}><span className="text-base leading-none">{t.icon}</span><span className="text-[10px] font-medium leading-none">{t.label}</span></button>)}
          </nav>
        </div>
      );
    }

    function Header({ title, subtitle, onLogout }) {
      return <header className="bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-10"><div className="flex items-center gap-2"><span className="text-xl">🐾</span><div><div className="font-bold text-sm leading-tight">{title}</div><div className="text-slate-400 text-xs">{subtitle}</div></div></div><button onClick={onLogout} className="text-slate-400 text-xs border border-slate-600 px-3 py-1.5 rounded-lg">Sign out</button></header>;
    }

    function TodayTab({ data, save }) {
      const tday = todayISO();
      const todayAsgns = data.assignments.filter(a => a.date === tday).sort((a, b) => a.shift.localeCompare(b.shift));
      const deleteAssignment = async (id) => { if (confirm("Delete this assignment?")) await save("assignments", data.assignments.filter(a => a.id !== id)); };
      return <div className="p-4 space-y-4"><div className="flex items-baseline justify-between"><h2 className="text-base font-bold text-slate-800">{fmtDate(tday)}</h2><span className="text-xs text-slate-400">{todayAsgns.length} assignment{todayAsgns.length !== 1 ? "s" : ""}</span></div>{todayAsgns.length === 0 ? <Empty icon="📋" title="No assignments today" subtitle="Go to Assign to create some." /> : todayAsgns.map(a => <AssignmentCard key={a.id} a={a} onDelete={() => deleteAssignment(a.id)} />)}</div>;
    }

    function AssignmentCard({ a, onDelete }) {
      const done = a.tasks.filter(t => t.completedAt).length;
      const pct = a.tasks.length ? Math.round(done / a.tasks.length * 100) : 0;
      const isAM = a.shift === "AM";
      return <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden"><div className={`px-4 py-3 flex items-center justify-between ${isAM ? "bg-amber-50 border-b border-amber-100" : "bg-indigo-50 border-b border-indigo-100"}`}><div className="flex items-center gap-2"><span className={`text-xs font-bold px-2.5 py-1 rounded-full ${isAM ? "bg-amber-500 text-white" : "bg-indigo-600 text-white"}`}>{isAM ? "☀️ AM" : "🌙 PM"}</span><span className="font-semibold text-slate-800 text-sm">{a.volunteerName || "Unknown"}</span></div><div className="flex items-center gap-3"><span className={`text-sm font-bold ${pct === 100 ? "text-emerald-600" : "text-slate-500"}`}>{done}/{a.tasks.length}</span>{onDelete && <button onClick={onDelete} className="text-slate-300 font-bold text-lg leading-none">✕</button>}</div></div><div className="h-1.5 bg-slate-100"><div className={`h-full ${pct === 100 ? "bg-emerald-500" : isAM ? "bg-amber-400" : "bg-indigo-500"}`} style={{ width: `${pct}%` }} /></div><div className="px-4 py-3 space-y-1.5">{a.tasks.map(t => <div key={t.id} className="flex items-center gap-2 text-sm"><span className={t.completedAt ? "text-emerald-500" : "text-slate-300"}>{t.completedAt ? "✓" : "○"}</span><span className={`flex-1 ${t.completedAt ? "line-through text-slate-400" : "text-slate-700"}`}>{t.catName && <span className="font-semibold text-slate-500">[{t.catName}] </span>}{t.name}</span>{t.completedAt && <span className="text-slate-300 text-xs">{fmtTime(t.completedAt)}</span>}</div>)}</div></div>;
    }

    function AssignTab({ data, save }) {
      const [date, setDate] = useState(todayISO());
      const [shift, setShift] = useState("AM");
      const [volId, setVolId] = useState("");
      const [selCats, setSelCats] = useState([]);
      const [selLocs, setSelLocs] = useState([]);
      const [specials, setSpecials] = useState([]);
      const [newSpecial, setNewSpecial] = useState("");
      const [flash, setFlash] = useState(null);

      const activeVols = data.volunteers.filter(v => v.active !== false);
      const activeCats = data.cats.filter(c => c.active !== false);
      const toggle = (arr, setArr, id) => setArr(arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id]);
      const addSpecial = (t = newSpecial) => { const val = t.trim(); if (val && !specials.includes(val)) setSpecials([...specials, val]); setNewSpecial(""); };
      const buildTasks = () => {
        const tasks = [];
        selCats.forEach(catId => {
          const cat = data.cats.find(c => c.id === catId); if (!cat) return;
          const locName = data.locations.find(l => l.id === cat.locationId)?.name ?? "";
          CAT_ROUTINE_TASKS.forEach(name => tasks.push({ id: uid(), type: "routine", catId, catName: cat.name, locationName: locName, name, completedAt: null }));
          (cat.medications || []).forEach(med => { if (med.schedule === "Both" || med.schedule === shift) tasks.push({ id: uid(), type: "medication", catId, catName: cat.name, locationName: locName, name: `Give ${med.name}${med.dosage ? " " + med.dosage : ""}${med.notes ? " — " + med.notes : ""}`, completedAt: null }); });
        });
        selLocs.forEach(locId => { const loc = data.locations.find(l => l.id === locId); if (loc) tasks.push({ id: uid(), type: "location", locationId: locId, locationName: loc.name, name: `Clean ${loc.name}`, completedAt: null }); });
        specials.forEach(name => tasks.push({ id: uid(), type: "special", name, completedAt: null }));
        return tasks;
      };
      const handleSave = async () => {
        if (!volId) return setFlash({ ok: false, msg: "Please select a volunteer." });
        const tasks = buildTasks(); if (!tasks.length) return setFlash({ ok: false, msg: "Add at least one cat, location, or special task." });
        const vol = data.volunteers.find(v => v.id === volId);
        await save("assignments", [...data.assignments, { id: uid(), date, shift, volunteerId: volId, volunteerName: vol?.name ?? "", tasks, createdAt: new Date().toISOString() }]);
        setSelCats([]); setSelLocs([]); setSpecials([]); setVolId(""); setFlash({ ok: true, msg: "Assignment saved!" }); setTimeout(() => setFlash(null), 2500);
      };
      return <div className="p-4 space-y-4"><h2 className="text-base font-bold text-slate-800">Create Assignment</h2>{flash && <div className={`text-sm px-4 py-3 rounded-xl font-medium ${flash.ok ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-600"}`}>{flash.msg}</div>}<Card title="Assignment Details"><div className="space-y-3"><Field label="Date" type="date" value={date} onChange={setDate}/><div><Label>Shift</Label><div className="grid grid-cols-2 gap-2">{["AM","PM"].map(s => <button key={s} onClick={() => setShift(s)} className={`py-2.5 rounded-xl text-sm font-semibold border-2 ${shift === s ? (s === "AM" ? "bg-amber-500 border-amber-500 text-white" : "bg-indigo-600 border-indigo-600 text-white") : "border-slate-200 text-slate-500"}`}>{s === "AM" ? "☀️ Morning" : "🌙 Afternoon"}</button>)}</div></div><div><Label>Volunteer</Label><select value={volId} onChange={e => setVolId(e.target.value)} className={inputCls}><option value="">— Select volunteer —</option>{activeVols.map(v => <option key={v.id} value={v.id}>{v.name}{v.email ? ` (${v.email})` : ""}</option>)}</select></div></div></Card><PickerCard title="🐱 Cats to care for" items={activeCats} selected={selCats} onToggle={id => toggle(selCats,setSelCats,id)} getTitle={c => c.name} getSubtitle={c => data.locations.find(l => l.id === c.locationId)?.name ?? "No location"}/><PickerCard title="🏠 Apartments / Catios to clean" items={data.locations} selected={selLocs} onToggle={id => toggle(selLocs,setSelLocs,id)} getTitle={l => l.name} getSubtitle={l => l.type}/><Card title="⭐ Special Tasks"><div className="flex flex-wrap gap-1.5 mb-3">{SPECIAL_TASK_TEMPLATES.map(t => <button key={t} onClick={() => addSpecial(t)} className={`text-xs px-3 py-1.5 rounded-full border ${specials.includes(t) ? "bg-orange-100 border-orange-300 text-orange-700" : "border-slate-200 text-slate-500"}`}>{t}</button>)}</div><div className="flex gap-2 mb-2"><input value={newSpecial} onChange={e => setNewSpecial(e.target.value)} onKeyDown={e => e.key === "Enter" && addSpecial()} placeholder="Add custom task…" className={`flex-1 ${inputCls}`} /><button onClick={() => addSpecial()} className="bg-slate-100 text-slate-700 px-4 rounded-xl text-sm font-medium">Add</button></div>{specials.map((t,i) => <div key={i} className="flex items-center justify-between bg-orange-50 border border-orange-100 rounded-xl px-3 py-2 mb-2"><span className="text-sm text-orange-800">⭐ {t}</span><button onClick={() => setSpecials(specials.filter((_,idx)=>idx!==i))} className="text-slate-400 text-lg font-bold">×</button></div>)}</Card><button onClick={handleSave} className="w-full bg-slate-900 text-white font-semibold py-4 rounded-2xl text-sm tracking-wide">Save Assignment</button></div>;
    }

    function PickerCard({ title, items, selected, onToggle, getTitle, getSubtitle }) {
      return <Card title={title}>{items.length === 0 ? <p className="text-slate-400 text-sm">Nothing added yet.</p> : <div className="space-y-2">{items.map(item => { const sel = selected.includes(item.id); return <div key={item.id} onClick={() => onToggle(item.id)} className={`flex items-center gap-3 p-3 rounded-xl border-2 cursor-pointer ${sel ? "border-teal-400 bg-teal-50" : "border-slate-100"}`}><div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${sel ? "bg-teal-500 border-teal-500" : "border-slate-300"}`}>{sel && <span className="text-white text-xs font-bold">✓</span>}</div><div className="flex-1 min-w-0"><div className="font-medium text-sm text-slate-800">{getTitle(item)}</div><div className="text-xs text-slate-400">{getSubtitle(item)}</div></div></div>;})}</div>}</Card>;
    }

    function CatsTab({ data, save }) {
      const empty = { name: "", locationId: "", cageNumber: "", status: "resident", medications: [], notes: "", active: true };
      const [mode,setMode]=useState("list"), [editing,setEditing]=useState(null), [form,setForm]=useState(empty);
      const setF=(k,v)=>setForm(p=>({...p,[k]:v}));
      const openNew=()=>{setForm(empty); setEditing("new"); setMode("form");};
      const openEdit=c=>{setForm({...c, medications:c.medications?[...c.medications]:[]}); setEditing(c); setMode("form");};
      const close=()=>{setMode("list"); setEditing(null); setForm(empty);};
      const addMed=()=>setF("medications",[...(form.medications||[]),{id:uid(),name:"",dosage:"",schedule:"AM",notes:""}]);
      const updMed=(i,k,v)=>{const meds=[...(form.medications||[])]; meds[i]={...meds[i],[k]:v}; setF("medications",meds);};
      const saveCat=async()=>{ if(!form.name.trim()) return; const cats=editing==="new"?[...data.cats,{...form,id:uid()}]:data.cats.map(c=>c.id===editing.id?{...form,id:c.id}:c); await save("cats",cats); close(); };
      const archive=async cat=>save("cats",data.cats.map(c=>c.id===cat.id?{...c,active:!c.active}:c));
      const active=data.cats.filter(c=>c.active!==false);
      if(mode==="form") return <div className="p-4 space-y-4"><BackBar onBack={close} title={editing==="new"?"Add Cat":"Edit Cat"}/><Card><div className="space-y-3"><Field label="Name *" value={form.name||""} onChange={v=>setF("name",v)} placeholder="e.g. Luna"/><div><Label>Location</Label><select value={form.locationId||""} onChange={e=>setF("locationId",e.target.value)} className={inputCls}><option value="">— None —</option>{data.locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}</select></div><Field label="Cage / Catio Number" value={form.cageNumber||""} onChange={v=>setF("cageNumber",v)} placeholder="e.g. 3A"/><div><Label>Status</Label><select value={form.status||"resident"} onChange={e=>setF("status",e.target.value)} className={inputCls}><option value="resident">Resident</option><option value="feral">Feral / Undomesticated</option><option value="foster">Foster</option></select></div><Field label="Notes" value={form.notes||""} onChange={v=>setF("notes",v)} multiline /></div></Card><Card title="💊 Medications">{(form.medications||[]).map((m,i)=><div key={m.id||i} className="border border-slate-200 rounded-xl p-3 space-y-2 mb-3"><Field label="Medication name" value={m.name||""} onChange={v=>updMed(i,"name",v)}/><Field label="Dosage" value={m.dosage||""} onChange={v=>updMed(i,"dosage",v)}/><div><Label>Schedule</Label><select value={m.schedule||"AM"} onChange={e=>updMed(i,"schedule",e.target.value)} className={inputCls}><option value="AM">Morning (AM) only</option><option value="PM">Afternoon (PM) only</option><option value="Both">AM & PM — twice daily</option></select></div><Field label="Notes" value={m.notes||""} onChange={v=>updMed(i,"notes",v)}/><button onClick={()=>setF("medications",(form.medications||[]).filter((_,idx)=>idx!==i))} className="text-red-400 text-xs font-medium">Remove medication</button></div>)}<button onClick={addMed} className="w-full border-2 border-dashed border-slate-200 text-slate-500 py-2.5 rounded-xl text-sm font-medium">+ Add Medication</button></Card><button onClick={saveCat} className="w-full bg-slate-900 text-white font-semibold py-4 rounded-2xl text-sm">Save Cat</button></div>;
      return <div className="p-4 space-y-4"><div className="flex items-center justify-between"><h2 className="text-base font-bold text-slate-800">Cats ({active.length})</h2><button onClick={openNew} className="bg-slate-900 text-white text-xs px-4 py-2 rounded-xl font-medium">+ Add Cat</button></div>{active.length===0?<Empty icon="🐱" title="No cats added yet" subtitle="Tap Add Cat to get started."/>:active.map(cat=><div key={cat.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4"><div className="flex items-start justify-between"><div><div className="font-semibold text-slate-800">{cat.name}</div><div className="text-sm text-slate-400 mt-0.5">{data.locations.find(l=>l.id===cat.locationId)?.name ?? "—"}{cat.cageNumber?` · Cage ${cat.cageNumber}`:""}</div>{cat.notes&&<p className="text-xs text-slate-400 mt-2 italic">{cat.notes}</p>}</div><div className="flex flex-col items-end gap-1.5 ml-3"><button onClick={()=>openEdit(cat)} className="text-xs text-teal-600 font-medium">Edit</button><button onClick={()=>archive(cat)} className="text-xs text-slate-400">Archive</button></div></div></div>)}</div>;
    }

    function LocationsTab({ data, save }) {
      const [mode,setMode]=useState("list"), [editing,setEditing]=useState(null), [form,setForm]=useState({});
      const openNew=()=>{setForm({name:"",type:"apartment",description:""}); setEditing("new"); setMode("form");};
      const openEdit=l=>{setForm({...l}); setEditing(l); setMode("form");};
      const close=()=>{setMode("list"); setEditing(null); setForm({});};
      const saveLoc=async()=>{if(!form.name?.trim())return; const locs=editing==="new"?[...data.locations,{...form,id:uid()}]:data.locations.map(l=>l.id===editing.id?{...form,id:l.id}:l); await save("locations",locs); close();};
      if(mode==="form") return <div className="p-4 space-y-4"><BackBar onBack={close} title={editing==="new"?"Add Location":"Edit Location"}/><Card><div className="space-y-3"><Field label="Name *" value={form.name||""} onChange={v=>setForm({...form,name:v})}/><div><Label>Type</Label><select value={form.type||"apartment"} onChange={e=>setForm({...form,type:e.target.value})} className={inputCls}><option value="apartment">Apartment</option><option value="catio">Catio</option><option value="other">Other</option></select></div><Field label="Description" value={form.description||""} onChange={v=>setForm({...form,description:v})} multiline /></div></Card><button onClick={saveLoc} className="w-full bg-slate-900 text-white font-semibold py-4 rounded-2xl text-sm">Save Location</button></div>;
      return <div className="p-4 space-y-4"><div className="flex items-center justify-between"><h2 className="text-base font-bold text-slate-800">Locations ({data.locations.length})</h2><button onClick={openNew} className="bg-slate-900 text-white text-xs px-4 py-2 rounded-xl font-medium">+ Add</button></div>{data.locations.length===0?<Empty icon="🏠" title="No locations yet" subtitle="Add apartments and catios here."/>:data.locations.map(loc=><div key={loc.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4"><div className="flex items-start justify-between"><div><div className="font-semibold text-slate-800">📍 {loc.name}</div><div className="text-sm text-slate-400 mt-0.5 capitalize">{loc.type}</div>{loc.description&&<p className="text-xs text-slate-400 mt-1.5 italic">{loc.description}</p>}</div><div className="flex flex-col items-end gap-1.5 ml-3"><button onClick={()=>openEdit(loc)} className="text-xs text-teal-600 font-medium">Edit</button><button onClick={()=>confirm(`Delete "${loc.name}"?`)&&save("locations",data.locations.filter(l=>l.id!==loc.id))} className="text-xs text-slate-400">Delete</button></div></div></div>)}</div>;
    }

    function VolunteersTab({ data, save }) {
      const [mode,setMode]=useState("list"), [editing,setEditing]=useState(null), [form,setForm]=useState({}), [showPins,setShowPins]=useState({}), [err,setErr]=useState("");
      const openNew=()=>{setForm({name:"",email:"",pin:"",active:true}); setEditing("new"); setMode("form"); setErr("");};
      const openEdit=v=>{setForm({...v}); setEditing(v); setMode("form"); setErr("");};
      const close=()=>{setMode("list"); setEditing(null); setForm({}); setErr("");};
      const saveVol=async()=>{ if(!form.name?.trim()) return setErr("Name is required."); if(!form.email?.trim()) return setErr("Email is required."); const email=cleanEmail(form.email); const conflict=data.volunteers.find(v=>cleanEmail(v.email)===email && v.id!==form.id); if(conflict) return setErr(`Email is already used by ${conflict.name}.`); const cleanForm={...form,email}; const vols=editing==="new"?[...data.volunteers,{...cleanForm,id:uid()}]:data.volunteers.map(v=>v.id===editing.id?{...cleanForm,id:v.id}:v); await save("volunteers",vols); close();};
      const active=data.volunteers.filter(v=>v.active!==false), inactive=data.volunteers.filter(v=>v.active===false);
      if(mode==="form") return <div className="p-4 space-y-4"><BackBar onBack={close} title={editing==="new"?"Add Volunteer":"Edit Volunteer"}/><Card><div className="space-y-3"><Field label="Full Name *" value={form.name||""} onChange={v=>setForm({...form,name:v})}/><Field label="Email *" type="email" value={form.email||""} onChange={v=>setForm({...form,email:v})} placeholder="volunteer@example.com"/><Field label="PIN (optional, legacy)" type="password" value={form.pin||""} onChange={v=>setForm({...form,pin:v})}/><p className="text-xs text-slate-400">Email must match the Firebase Authentication user email.</p>{err&&<div className="text-sm text-red-600 bg-red-50 px-3 py-2 rounded-xl">{err}</div>}</div></Card><button onClick={saveVol} className="w-full bg-slate-900 text-white font-semibold py-4 rounded-2xl text-sm">Save Volunteer</button></div>;
      return <div className="p-4 space-y-4"><div className="flex items-center justify-between"><h2 className="text-base font-bold text-slate-800">Volunteers ({active.length})</h2><button onClick={openNew} className="bg-slate-900 text-white text-xs px-4 py-2 rounded-xl font-medium">+ Add</button></div>{active.length===0?<Empty icon="👤" title="No volunteers yet" subtitle="Add volunteers and set their emails."/>:active.map(vol=><div key={vol.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4"><div className="flex items-center justify-between"><div><div className="font-semibold text-slate-800">{vol.name}</div><div className="text-sm text-slate-400 mt-0.5">{vol.email||"No email"}</div>{vol.pin&&<div className="text-xs text-slate-400 mt-0.5 font-mono">Legacy PIN: {showPins[vol.id]?vol.pin:"••••"}<button onClick={()=>setShowPins({...showPins,[vol.id]:!showPins[vol.id]})} className="ml-2 text-xs text-teal-500 font-sans">{showPins[vol.id]?"hide":"reveal"}</button></div>}</div><div className="flex flex-col items-end gap-1.5 ml-3"><button onClick={()=>openEdit(vol)} className="text-xs text-teal-600 font-medium">Edit</button><button onClick={()=>save("volunteers",data.volunteers.map(v=>v.id===vol.id?{...v,active:!v.active}:v))} className="text-xs text-slate-400">Deactivate</button></div></div></div>) }{inactive.length>0&&<p className="text-center text-xs text-slate-400 mt-1">{inactive.length} inactive volunteer{inactive.length>1?"s":""} not shown.</p>}</div>;
    }

    function HistoryTab({ data }) {
      const [date,setDate]=useState(todayISO());
      const asgns=data.assignments.filter(a=>a.date===date).sort((a,b)=>a.shift.localeCompare(b.shift));
      return <div className="p-4 space-y-4"><div className="flex items-center justify-between"><h2 className="text-base font-bold text-slate-800">History</h2><input type="date" value={date} onChange={e=>setDate(e.target.value)} className="border border-slate-200 rounded-xl px-3 py-1.5 text-sm bg-white"/></div>{asgns.length===0?<Empty icon="📅" title="No assignments found" subtitle={`Nothing recorded for ${fmtDate(date)}.`}/>:asgns.map(a=><AssignmentCard key={a.id} a={a}/>)}</div>;
    }

    function SettingsTab({ user }) {
      return <div className="p-4 space-y-4"><h2 className="text-base font-bold text-slate-800">Settings</h2><Card title="🔐 Secure login"><p className="text-sm text-slate-600 leading-relaxed">Signed in as <strong>{user?.email}</strong>.</p><p className="text-sm text-slate-500 mt-2 leading-relaxed">This version uses Firebase Authentication. After confirming coordinator and volunteer logins work, change Realtime Database Rules to require authenticated users.</p></Card></div>;
    }

    function VolunteerApp({ user, data, save, onLogout }) {
      const tday=todayISO();
      const myAsgns=data.assignments.filter(a=>a.date===tday&&a.volunteerId===user.id).sort((a,b)=>a.shift.localeCompare(b.shift));
      const markTask=async(aId,tId)=>{const now=new Date().toISOString(); const updated=data.assignments.map(a=>a.id!==aId?a:{...a,tasks:a.tasks.map(t=>t.id!==tId?t:{...t,completedAt:t.completedAt?null:now})}); await save("assignments",updated);};
      const groupByCat=(tasks)=>{const catMap={}, other=[]; tasks.forEach(t=>{if(t.catId){if(!catMap[t.catId])catMap[t.catId]={catName:t.catName,locName:t.locationName,tasks:[]}; catMap[t.catId].tasks.push(t);}else other.push(t);}); return {catGroups:Object.values(catMap),other};};
      return <div className="min-h-screen bg-slate-50 flex flex-col"><Header title="Zaenid Michis" subtitle={`Hi, ${user.name}!`} onLogout={onLogout}/><main className="flex-1 p-4 space-y-4"><h2 className="text-base font-bold text-slate-800">{fmtDate(tday)}</h2>{myAsgns.length===0?<div className="text-center py-16"><div className="text-6xl mb-4">😺</div><p className="font-semibold text-slate-700">No tasks assigned for today.</p><p className="text-sm text-slate-400 mt-1">Check back later or contact the coordinator.</p></div>:myAsgns.map(a=>{const {catGroups,other}=groupByCat(a.tasks), done=a.tasks.filter(t=>t.completedAt).length, pct=a.tasks.length?Math.round(done/a.tasks.length*100):0, isAM=a.shift==="AM"; return <div key={a.id} className={`rounded-2xl border-2 overflow-hidden ${isAM?"border-amber-200":"border-indigo-200"}`}><div className={`px-4 py-3 ${isAM?"bg-amber-500":"bg-indigo-600"}`}><div className="flex items-center justify-between mb-2"><span className="text-white font-bold">{isAM?"☀️ Morning Shift":"🌙 Afternoon Shift"}</span><span className="text-white text-sm font-semibold opacity-90">{done}/{a.tasks.length}</span></div><div className="bg-black bg-opacity-20 rounded-full h-2"><div className="h-2 bg-white rounded-full" style={{width:`${pct}%`}}/></div></div>{pct===100&&<div className="bg-emerald-500 text-white text-sm font-semibold text-center py-2">🎉 Shift complete — great work!</div>}<div className="bg-white">{catGroups.map(g=><div key={g.catName}><div className={`px-4 py-2 flex items-center gap-2 border-b border-slate-100 ${isAM?"bg-amber-50":"bg-indigo-50"}`}><span>🐱</span><span className="font-semibold text-slate-800 text-sm">{g.catName}</span>{g.locName&&<span className="text-xs text-slate-400">{g.locName}</span>}</div><div className="divide-y divide-slate-100">{g.tasks.map(t=><TaskRow key={t.id} task={t} onToggle={()=>markTask(a.id,t.id)}/>)}</div></div>)}{other.length>0&&<div><div className="px-4 py-2 bg-slate-50 border-y border-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">Other Tasks</div><div className="divide-y divide-slate-100">{other.map(t=><TaskRow key={t.id} task={t} onToggle={()=>markTask(a.id,t.id)}/>)}</div></div>}</div></div>;})}</main></div>;
    }

    function TaskRow({ task, onToggle }) {
      const icon=task.type==="medication"?"💊":task.type==="location"?"🏠":task.type==="special"?"⭐":null;
      return <div onClick={onToggle} className={`flex items-center gap-3 px-4 py-3.5 cursor-pointer select-none ${task.completedAt?"bg-emerald-50":"active:bg-slate-50"}`}><div className={`w-7 h-7 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${task.completedAt?"bg-emerald-500 border-emerald-500":"border-slate-300"}`}>{task.completedAt&&<span className="text-white text-xs font-bold">✓</span>}</div><div className="flex-1 min-w-0"><div className={`text-sm leading-snug ${task.completedAt?"line-through text-slate-400":"text-slate-800"}`}>{icon&&<span className="mr-1">{icon}</span>}{task.name}</div>{task.completedAt&&<div className="text-xs text-slate-400 mt-0.5">Done at {fmtTime(task.completedAt)}</div>}</div></div>;
    }

    const inputCls="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white";
    function Label({children}){return <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">{children}</label>;}
    function Field({label,value,onChange,placeholder="",type="text",multiline=false}){return <div><Label>{label}</Label>{multiline?<textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={3} className={inputCls}/>:<input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className={inputCls}/>}</div>;}
    function Card({title,children}){return <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">{title&&<h3 className="font-semibold text-slate-700 text-sm mb-3">{title}</h3>}{children}</div>;}
    function BackBar({onBack,title}){return <div className="flex items-center gap-3 mb-2"><button onClick={onBack} className="text-teal-600 text-sm font-medium">← Back</button><h2 className="text-base font-bold text-slate-800">{title}</h2></div>;}
    function Empty({icon,title,subtitle}){return <div className="text-center py-14"><div className="text-5xl mb-3">{icon}</div><p className="font-semibold text-slate-700">{title}</p>{subtitle&&<p className="text-sm text-slate-400 mt-1">{subtitle}</p>}</div>;}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then(() => console.log("Service worker registered"))
          .catch(err => console.error("Service worker registration failed:", err));
      });
    }
  </script>
</body>
</html>

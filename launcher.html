<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Zaenid Michis</title>
  <style>html,body{margin:0;min-height:100%;background:#0f172a;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100dvh;display:grid;place-items:center;text-align:center}.paw{font-size:52px}.name{font-size:22px;font-weight:800;margin-top:8px}.sub{color:#94a3b8;margin-top:6px;font-size:13px}</style>
</head>
<body>
<div class="wrap"><div><div class="paw">🐾</div><div class="name">Zaenid Michis</div><div class="sub">Opening…</div></div></div>
<script>
(async()=>{
  const openApp=()=>location.replace('./?home=1');
  if(!('serviceWorker' in navigator)){openApp();return}
  try{
    const target=new URL('./sw-v22.js',location.href).href;
    const reg=await navigator.serviceWorker.register('./sw-v22.js',{scope:'./',updateViaCache:'none'});
    try{await reg.update()}catch{}
    const isTarget=()=>navigator.serviceWorker.controller?.scriptURL===target;
    if(!isTarget()){
      await new Promise(resolve=>{
        let done=false;
        const finish=()=>{if(done)return;done=true;resolve()};
        const check=()=>{if(isTarget())finish()};
        navigator.serviceWorker.addEventListener('controllerchange',check);
        const candidate=reg.installing||reg.waiting;
        if(candidate)candidate.addEventListener('statechange',check);
        setTimeout(finish,4000);
      });
    }
    openApp();
  }catch(e){openApp()}
})();
</script>
</body>
</html>
